# The Sparked Dev FHIR Server is a single node, aucore, as of 2026-08-02.
#
# ereq and hl7au are DECOMMISSIONED. This is stage 1 of 2: the nodes are disabled
# so their pods stop, but their config blocks, their `db_users` entries in
# terraform/main.tf and their databases are all left in place. That keeps the
# decommission a one-line revert for as long as the data is still wanted.
#
#   ereq   the AU eRequesting project is no longer run under Sparked; the agreed
#          hosting period ran to end July 2026 (issue #85, requested by @dt-r).
#   hl7au  decommissioned alongside it on the environment owner's direction. Note
#          this node is NOT the HL7 AU reference server at fhir.hl7.org.au, which
#          is a separate system and is unaffected.
#
# The AU eRequesting IG package (hl7.fhir.au.ereq) is a different thing from the
# ereq NODE and is unaffected: the terminology servers still publish it, so
# nothing under terminology-servers/ changes.
#
# Stage 2, after the data is confirmed no longer needed: delete these two node
# blocks, drop the `ereq` and `hl7au` entries from `db_users` in
# terraform/main.tf (which drops the databases), and remove
# module-config/packages/package-au-erequesting-1.0.0.json together with its
# `helm_chart_mapped_files` entry and its values-common.yaml reference. Only ereq
# seeded that package, so nothing else loses it.
#
# Deployment note (historical, applies whenever more than one node is enabled):
# start with just aucore, then add nodes sequentially, otherwise a configmap
# duplicate name issue can occur. hl7au took ~1min 50sec to deploy with config.
cdrNodes:
  masterdev:
    enabled: false
  aucore:
    name: aucore
    enabled: true
    # AU Patient Summary generator jar (consumed by ig_support.ips.generation_strategy_class
    # below). aucore runs the current 1.0.2 release; ereq pins the older 0.1.0-alpha.
    copyFiles:
      customerlib:
        sources:
        - type: s3
          bucket: ${s3_bucket} # Rendered from var.s3_bucket_name via templatefile() in terraform/main.tf
          path: /smile/hapi-aups-generator-1.0.2.jar
    config:
      locked: false
      database: true
    modules:
      clustermgr:
        config:
          db.schema_update_mode: UPDATE
      persistence:
        config:
          seed.base_validation_resources: true
          package_registry.resource_status_validation_filter.enabled: false
          package_registry.load_specs_asynchronously: false
          # Dependencies first. apply_ig_release.py appends a brand new package,
          # but hl7.terminology and smart-app-launch are dependencies of the AU
          # Base and AU Core ballots, so on a fresh node they have to be present
          # before those install. Order is significant here and is preserved on
          # subsequent version bumps, which replace in place.
          package_registry.startup_installation_specs: "classpath:/config_seeding/package-hl7-terminology-7.3.0.json classpath:/config_seeding/package-smart-app-launch-2.2.0.json classpath:/config_seeding/package-au-base-7.0.0-ballot1.json classpath:/config_seeding/package-au-patient-summary-1.0.0.json classpath:/config_seeding/package-aucore-3.0.0-ballot1.json classpath:/config_seeding/package-international-patient-summary-2.0.1.json"
          # Pulled from the live aucore node (2026-07-20) to eliminate seed drift.
          # Adds CarePlan/Goal/CareTeam (patient Care Plan viewer support) and the
          # DiagnosticReport/DocumentReference/MedicationDispense/Endpoint/Bundle
          # types that were already enabled live but never written back to the seed.
          #
          # Binary is deliberately NOT whitelisted. It was added on 2026-08-24 so
          # the two AU Core PDF reports would load, and reverted the same day:
          # Smile CDR's package registry stores its own content as Binary in this
          # partition, so whitelisting the type exposed 28036 Binary resources to
          # anonymous read, 28019 application/fhir+json package fragments and 15
          # application/gzip package tarballs up to 4.5 MB each, against the 2
          # PDFs actually wanted. It also makes a loader wipe-all dangerous: the
          # sweep list is type-driven, so any change that derives it from the
          # server's CapabilityStatement would delete the package registry and
          # take the installed IGs with it.
          #
          # The cost of leaving it off is that
          # DiagnosticReport/rh-status-report-1 and
          # DiagnosticReport/creatinine-clearance-report-1 have a
          # presentedForm[0].url that 404s. Fixing that properly means keeping
          # package storage off the FHIR Binary surface, not whitelisting Binary.
          resource_types.supported.whitelist: "CarePlan,Goal,CareTeam,Endpoint,DocumentReference,MedicationDispense,DiagnosticReport,Bundle,MedicationStatement,CommunicationRequest,Task,Consent,ServiceRequest,Device,Composition,StructureDefinition,SearchParameter,Questionnaire,StructureMap,AllergyIntolerance,Condition,Encounter,Immunization,Location,Observation,Organization,Patient,Practitioner,PractitionerRole,Procedure,Medication,MedicationRequest,Coverage,Specimen,RelatedPerson,HealthcareService,QuestionnaireResponse"
          # Put per-type resource counts on the CapabilityStatement, which is
          # where sparked-test-data-loader reads them from (aehrc/sparked-test-data-loader#29):
          # one /metadata request for the whole node instead of a count query per
          # resource type. Counting per type is not an option here, because this
          # server refuses both routes to a search total, HAPI-2038 for
          # _summary=count and HAPI-2037 for _total=accurate, deliberately: they
          # force a full count on demand and this endpoint is readable without
          # authentication.
          #
          # cache.minutes is not optional and not a tuning knob. /metadata is
          # unauthenticated and fetched by every client for conformance, so
          # without a cache each request would count all 38 supported types,
          # which is a heavier lever than the one the refusals above close off.
          #
          # One minute rather than longer: the counts are read straight after a
          # load or clear, and a server-computed cache cannot be busted by a
          # client Cache-Control header, so the cache duration is exactly how
          # stale a freshly loaded count can look. One minute keeps /metadata
          # cheap without making the dashboard lie for long.
          metadata.resource_counts.enabled: true
          metadata.resource_counts.cache.minutes: 1
          validator.local_reference_policy: "NOT_VALIDATED"
          validator.unknown_codesystem_validation_policy: "GENERATE_WARNING"
          remote_term_svc.enabled: true
          remote_term_svc.base_url: "https://tx.dev.hl7.org.au/fhir"
          dao_config.default_total_mode: "NONE"
          dao_config.delete_enabled: true
          dao_config.enforce_referential_integrity_on_delete.enabled: true
          # Both set true on 2026-08-03 to match the live server, which has run
          # them enabled since an undated console change while this file asserted
          # the opposite. Not a silent omission: the repo actively disagreed.
          #
          # Recorded because the obvious justification does NOT hold. The
          # test-data tooling depends on neither: clear_test_data.py deletes
          # single resources by id rather than by search criteria, so it needs no
          # multiple-delete, and load_test_data.py orders resources by
          # RESOURCE_TYPE_ORDER so it does not rely on placeholder creation. The
          # flags that tooling actually needs are the expunge pair below.
          #
          # Chosen for parity instead. A migration should reproduce the server
          # that exists rather than quietly harden it: something undocumented may
          # rely on these (a vendor transaction bundle carrying forward
          # references, a participant workflow), and a rebuild is the wrong moment
          # to discover that.
          #
          # Both do loosen the server, so they deserve a deliberate review as
          # their own change once the migration is done:
          #   allow_multiple_delete            permits DELETE by search criteria,
          #                                    so one bad query can remove many
          #   auto_create_placeholder_targets  silently invents referenced
          #                                    resources instead of rejecting a
          #                                    dangling reference
          dao_config.auto_create_placeholder_reference_targets.enabled: true
          dao_config.allow_multiple_delete.enabled: true
          dao_config.allows_external_references.enabled: true
          dao_config.allow_external_references.enabled: true
          dao_config.server_id_mode: "UUID" #AUTOGENERATE instead?
          dao_config.fetch_size.default_maximum: 1000
          dao_config.allow_contains_searches: true
          dao_config.match_url_cache.enabled: true
          # The four below are live on the server and were absent here, so a
          # rebuild silently produced a less capable node. All were console edits.
          #
          # The two expunge flags are not optional extras: scripts/clear_test_data.py
          # and the clear-test-data workflow both drive $expunge, and without them
          # clearing test data between events fails.
          dao_config.delete_expunge_enabled: true
          dao_config.expunge_operation_enabled: true
          # Required for the AU Patient Summary $summary operation, which is what
          # ig_support.ips.generation_strategy_class below plugs into. Without it
          # the generator jar is loaded and never invoked.
          ig_support.ips.enabled: true
          # Restricts subscription resthook targets to http/https URLs.
          subscription.resthook.url_validation_regex: "((((http?|https?)://))([-%()_.!~*';/?:@&=+$,A-Za-z0-9])+)"
          dao_config.client_id_mode: "ANY"
          subscription.rest_hook_enabled: true
          subscription.message.enabled: true
          subscription.cross_partition_enabled: false # need to check with heath on this
          versioned_references.allow_at_paths: "AuditEvent.entity.what, MessageHeader.focusProvenance.target"
          versioned.references.respect_for_search_includes: true
          partitioning.enabled: true
          partitioning.partition_selection_mode: "REQUEST_TENANT"
          # search_parameter_seeding.disable_patterns: ""
          # search_parameter_seeding.enable_patterns: ""
          ig_support.ips.generation_strategy_class: "au.org.hl7.fhir.ps.strategy.AupsGenerationStrategy"
          db.driver: POSTGRES_9_4
          db.url: jdbc:postgresql://#{env['AUCORE_DB_URL']}:#{env['AUCORE_DB_PORT']}/#{env['AUCORE_DB_DATABASE']}?sslmode=require
          db.password: "#{env['AUCORE_DB_PASS']}"
          db.username: "#{env['AUCORE_DB_USER']}"
      fhir_endpoint:
        # SECURITY_IN_OIC is the one module dependency that is neither a chart
        # default nor was previously declared here, and without it
        # security.oic.enabled below is set with nothing providing OIDC.
        #
        # The chart's default-modules.yaml wires PERSISTENCE_ALL and
        # SECURITY_IN_UP for this module but not SECURITY_IN_OIC, and the live
        # server only has it because it was added out of band at some point. A
        # server built from this repo alone therefore fails to boot the endpoint:
        #
        #   Error creating bean with name 'webSecurityFilterChain' ...
        #   No dependency of type 'OpenID Connect Authentication' has been specified
        #
        # Found 2026-08-02 on the first cold boot of the sparkey deployment, which
        # is the first time this config has ever been applied to an empty
        # database. No-op against the live server, whose module records already
        # carry the dependency (config.database: true means seeded properties
        # apply on first boot only).
        requires:
          SECURITY_IN_OIC: smart_auth
        config:
          request_validating.enabled: true
          partitioning.tenant_identification_strategy: "URL_BASED"
          context_path: "aucore/fhir"
          # The advertised FHIR base: CapabilityStatement implementation.url,
          # Bundle pagination links and entry.fullUrl are all built from it.
          #
          # NOT optional, and NOT derived from specs.hostname. Left unset the
          # chart falls back to the in-cluster Service address, and the rebuilt
          # server duly advertised "http://smilecdr-scdr-svc-fhir:8000/aucore/fhir"
          # to the outside world. Set on the live server but only ever as a
          # console edit, so it was invisible here until a cold boot exposed it.
          #
          # Pinned to the production hostname on both deployments, including the
          # one served at smile-next during the migration, so the parallel server
          # advertises the base clients already use and cutover needs no config
          # change. Same reasoning as issuer.url and specs.hostname.
          base_url.fixed: "https://smile.sparked-fhir.com/aucore/fhir"
          # Required to set base_url.fixed at all. The chart autoconfigures that
          # value from its OWN ingress: to the ingress hostname when one is
          # enabled, and to the in-cluster Service address when none is. It then
          # rejects any explicit value that disagrees, which is why the first
          # attempt failed with:
          #
          #   `base_url.fixed` is set to `https://smile.sparked-fhir.com/aucore/fhir`
          #   for the `fhir_endpoint` module. This is an invalid configuration.
          #   If you need to override this, you can set `base_url.mismatch_allowed`.
          #
          # The chart is blunt about the escape hatch (_scdr-module-helpers.tpl):
          # "This is not supported and may lead to unpredictable behaviour. It is
          # only suitable for troubleshooting where you need to override the
          # value."
          #
          # Used deliberately anyway, because the chart's assumption does not hold
          # here: it infers that a deployment with no chart-managed ingress is
          # reachable only in-cluster. On sparkey the routing is real but owned
          # outside the chart, by the HTTPRoutes in sparked-argo, which is the
          # arrangement upstream itself documents ("sdh-deps does not create the
          # Gateway itself"). The chart cannot know the external hostname, so it
          # has to be told.
          #
          # The effect is narrow and understood: the value passes through
          # verbatim instead of being overwritten by the sentinel. Revisit if the
          # chart ever gains a way to declare an externally-managed hostname.
          base_url.mismatch_allowed: true
          security.oic.enabled: true
          # Consent service enforcing ADR 0001: DEFAULT is readable by everyone
          # and writable by nobody except curators. FHIR_ACCESS_PARTITION_NAME
          # gates read and write together, so a tenant principal that needs an
          # authenticated DEFAULT read has to be granted DEFAULT access outright;
          # this script supplies the missing half by rejecting DEFAULT writes.
          #
          # On the endpoint, NOT on persistence. Package registry seeding and IG
          # installs write into DEFAULT below the REST layer, so an endpoint
          # mount cannot stop the node coming up, while a storage mount would put
          # this script in the startup path. Participant traffic is all REST.
          #
          # SHIPS IN OBSERVE MODE: the script's ENFORCE flag is false, so it logs
          # what it would reject and rejects nothing. Verify the logs on the node
          # before flipping it. docs/consent-service-rollout.md has the procedure
          # and the rollback (set consent_service.enabled false, redeploy).
          consent_service.enabled: true
          consent_service.script.file: "classpath:config_seeding/consent-default-readonly.js"
      package_registry:
        config:
          context_path: "aucore/package"
      admin_web:
        config:
          context_path: "aucore/console"
          # Both live on the server and absent here until the 2026-08-03 drift
          # audit. Cosmetic rather than functional, but carried so a rebuild
          # reproduces the console operators actually see.
          prometheus_datasource_id: "prom"
          privacy_security_notice.copy: "This access is governed by our Privacy and Security notice.Please agree to these terms."
      # Not previously declared at all: the chart's default local_security module
      # was taken as-is, so this setting existed only as a console edit on the
      # live server.
      #
      # NOTE the value is weak: `.{4,100}` permits a four-character password on a
      # publicly reachable server. It is carried verbatim so the rebuild matches
      # live rather than silently changing auth behaviour mid-migration. Tighten
      # it deliberately, as its own change, once the migration is done.
      local_security:
        config:
          password_pattern: ".{4,100}"
      admin_json:
        config:
          context_path: "aucore/admin-json"
      fhirweb_endpoint:
        enabled: true
        config:
          context_path: "aucore/fhirweb"
      # NOTE: node config is database-backed (config.database: true), so this
      # block only seeds a first boot. The live smart_auth config is reconciled
      # from the repo with scripts/sync_smart_auth.py; run its --dry-run to see
      # drift. smart_capabilities_list is multi-line and is managed solely by
      # the sync script (properties rendering of multi-line values is unsafe).
      smart_auth:
        name: security_out_smart
        config:
          # The OIDC issuer, and the base every endpoint in
          # .well-known/openid-configuration is built from. It is NOT derived
          # from specs.hostname: leave it unset and the server advertises
          # "https:///aucore/smartauth" with an empty host, which breaks
          # discovery for every SMART client.
          #
          # Set on the live server but absent from this repo until 2026-08-03, so
          # it could only surface on a cold boot (config.database means seeded
          # properties apply on first boot only). Same class of gap as the
          # SECURITY_IN_OIC dependency and the token-signing keystore.
          #
          # Deliberately names the PRODUCTION hostname on both deployments,
          # including the one served at smile-next during the migration, so the
          # parallel server issues tokens carrying the issuer clients already
          # trust and cutover needs no config change or restart. Same reasoning
          # as specs.hostname; see the header of values-sparkey.yaml.
          issuer.url: "https://smile.sparked-fhir.com/aucore/smartauth"
          # SMART capability advertisement in .well-known/smart-configuration.
          #
          # The value Smile CDR wants is newline-separated, and the chart renders
          # every config item as one "key \t= value" properties line, so a real
          # newline cannot be expressed. The comma-separated form its neighbours
          # use (auth_request_detail.whitelist above) is rejected outright:
          #
          #   Module [smart_auth] failed to start!
          #   Error creating bean with name 'smartCapabilitiesSet'
          #
          # So this uses ESCAPED newlines. Single-quoted in YAML so the backslash
          # survives as a literal character, giving the properties file
          # `...= launch-ehr\nlaunch-standalone\n...` on one line, which
          # java.util.Properties unescapes back into the multi-line value.
          # Verified by rendering the chart offline before applying.
          #
          # Why bother, rather than leaving it to scripts/sync_smart_auth.py:
          # that script applies over the admin API, and this node runs
          # PROPERTIES_UNLOCKED, where properties are re-read and overwrite the
          # module config on every boot. Measured 2026-08-03: the script's
          # changes were gone after one pod restart. Anything that must survive a
          # restart has to be here, not applied afterwards.
          #
          # context-ehr-encounter is the entry that matters: smart-post-authorize.js
          # injects encounter launch context, and the chart default omits it.
          smart_capabilities_list: 'launch-ehr\nlaunch-standalone\nclient-public\nclient-confidential-symmetric\ncontext-ehr-patient\ncontext-ehr-encounter\ncontext-standalone-patient\nsso-openid-connect\npermission-patient\npermission-offline'
          context_path: "aucore/smartauth"
          auth_request_detail.whitelist: "aud,grant_type,scope,launch"
          openid.signing.keystore_id: smilecdr-token-signing
          post_authorize_script.file: "classpath:config_seeding/smart-post-authorize.js"
          cors.enable: true
  hl7au:
    name: hl7au
    # DECOMMISSIONED 2026-08-02 (stage 1 of 2). See the header note at the top of
    # this file. The node config below is retained verbatim so the change is a
    # one-line revert while the hl7au database still exists.
    enabled: false
    # hl7au does not run the AUPS generator, but it already carried the 1.0.0 jar
    # under the previous global copyFiles. Keep it here so moving copyFiles per-node
    # does not change hl7au's pod spec (avoids an unnecessary restart).
    copyFiles:
      customerlib:
        sources:
        - type: s3
          bucket: ${s3_bucket} # Rendered from var.s3_bucket_name via templatefile() in terraform/main.tf
          path: /smile/hapi-aups-generator-1.0.0.jar
    config:
      database: true
    modules:
      persistence:
        config:
          seed.base_validation_resources: true
          package_registry.resource_status_validation_filter.enabled: false
          package_registry.load_specs_asynchronously: false
          package_registry.startup_installation_specs: "classpath:/config_seeding/package-au-base-6.1.1-draft.json classpath:/config_seeding/package-aucore-2.1.0-draft.json"
          resource_types.supported.whitelist: "MedicationStatement,CommunicationRequest,Task,Consent,ServiceRequest,Device,Composition,StructureDefinition,SearchParameter,Questionnaire,StructureMap,AllergyIntolerance,Condition,Encounter,Immunization,Location,Observation,Organization,Patient,Practitioner,PractitionerRole,Procedure,Medication,MedicationRequest,Coverage,Specimen,RelatedPerson,HealthcareService,QuestionnaireResponse"
          metadata.resource_counts.enabled: false
          validator.local_reference_policy: "NOT_VALIDATED"
          validator.unknown_codesystem_validation_policy: "GENERATE_WARNING"
          remote_term_svc.enabled: true
          remote_term_svc.base_url: "https://tx.dev.hl7.org.au/fhir"
          dao_config.default_total_mode: "NONE"
          dao_config.delete_enabled: true
          dao_config.enforce_referential_integrity_on_delete.enabled: true
          dao_config.auto_create_placeholder_reference_targets.enabled: false
          dao_config.allow_multiple_delete.enabled: false
          dao_config.allow_external_references.enabled: true
          partitioning.enabled: true
          partitioning.partition_selection_mode: "REQUEST_TENANT"
         #  search_parameter_seeding.disable_patterns: ""
         #  search_parameter_seeding.enable_patterns: ""
          db.driver: POSTGRES_9_4
          db.url: jdbc:postgresql://#{env['HL7AU_DB_URL']}:#{env['HL7AU_DB_PORT']}/#{env['HL7AU_DB_DATABASE']}?sslmode=require
          db.password: "#{env['HL7AU_DB_PASS']}"
          db.username: "#{env['HL7AU_DB_USER']}"
      fhir_endpoint:
        config:
          request_validating.enabled: true
          partitioning.tenant_identification_strategy: "URL_BASED"
          context_path: "hl7au/fhir"
          security.oic.enabled: true
      package_registry:
        config:
          context_path: "hl7au/package"
      admin_web:
        config:
          context_path: "hl7au/console"
      admin_json:
        config:
          context_path: "hl7au/admin-json"
      # Live hl7au drift (2026-07-15): the running module sits at bare
      # /smartauth with issuer https://smile.sparked-fhir.com/smartauth and the
      # default-keystore, predating the per-node layout. This block records the
      # intended state; hl7au is deliberately excluded from sync_smart_auth.py
      # until the context-path/ingress move is planned.
      smart_auth:
        config:
          context_path: "hl7au/smartauth"
          cors.enable: true
      fhirweb_endpoint:
        enabled: true
        config:
          context_path: "/hl7au/fhirweb"
  ereq:
    name: ereq
    # DECOMMISSIONED 2026-08-02 (stage 1 of 2), per issue #85. See the header note
