# Operator checklist for a Sparked event, T-2 weeks to T+1 week.
#
# scripts/render_event.py turns this into docs/operators/events/<event>-checklist.md
# with real dates from the event manifest. The operator opens a GitHub issue
# from the rendered file (gh issue create --body-file ...).
#
# Each item has an anchor, an offset in days from it, and a task. Anchors:
#   event_start, event_end         the first and last event days
#   freeze_start, freeze_end       the freeze window (date and time)
#   sandbox_opens                  first moment a sandbox can be created
#   sandbox_creation_closes        last moment a sandbox can be created
#   sandbox_expires                the morning after the night every event sandbox expires
# Tasks may use the same {{ placeholders }} as the participant guide, plus the
# freeze.* values the sparked-argo freeze blocks render (freeze.cron_local,
# freeze.cron_utc, freeze.duration, freeze.timezone, freeze.node_expiry_window).
# A task may run over several lines (use a YAML block scalar); its code blocks
# render inside the list item.
#
# An item with `todo: true` is a gap still to be written; it renders as a
# clearly marked TODO so nobody mistakes it for a finished step. An item with
# `only_for: [<event id>, ...]` renders for those events only (one-off setup).
#
# The freeze steps come from the event freeze runbook: Argo CD sync windows
# and Renovate skips (aehrc/sparked-argo scripts/event-freeze.py and
# docs/event-freeze.md), Karpenter disruption budgets and the tx.dev preload
# overlay. Inferno prod (`inferno-prod`) renders hl7au/au-fhir-inferno
# `master`; the `inferno` sync window is what holds it through the freeze.
# Every kubectl below is read-only unless it says otherwise and needs an AWS
# SSO session (aws sso login with your AWS SSO profile for the Sparked account).

items:
  - anchor: event_start
    offset_days: -14
    task: "Re-check every fact in `events/{{ event.id }}.yaml` against the live services (version map, `not_on_sparked`, Inferno suites, data commits, known issues); update `last_checked`; run `python scripts/render_event.py --check-links events/{{ event.id }}.yaml` and fix any link that fails."
  - anchor: event_start
    offset_days: -14
    task: "Confirm the version map with the track leads: Sparked serves the ballots, {{ server.hl7au-reference.fhir_base }} serves the stable releases. Make sure each track page links the right server, and that every track whose IG Sparked does not serve is in `not_on_sparked`."
  - anchor: event_start
    offset_days: -14
    task: "Ask the HL7 AU test data maintainers whether an event tag of hl7au/au-fhir-test-data is planned (as for earlier events); if it is, record it in `data` of the manifest."
  - anchor: event_start
    offset_days: -14
    task: "Turn the previous event's loader banner off at loader.sparked-fhir.com until git sets it from `loader_banner`."

  - anchor: event_start
    offset_days: -11
    only_for: [2026-12-melbourne]
    task: |
      **Smile node roll and AMQ fix (one-off; one weekday, one restart; before the sandbox scratch run below and any other bulk write, and by Mon 30 Nov at the latest, or Smile restarts at 12:29 AEDT on Thu 10 Dec).** The live NodeClaim `on-demand-prod-pr76v` was created 2026-11-10T01:29:08Z with `expireAfter: 720h` and expires 2026-12-10T01:29:08Z; disruption budgets cannot stop expiration in Karpenter v1. Separately, until aehrc/sparked-fhir-server-configuration#123 is applied, every resource write adds about 1.6 KB to a broker queue nothing drains, and Smile is evicted at about 65,000 messages, so the scratch run, the sandbox batch and any test-data reload wait for this item.
      1. Between 08:00 and 18:00 AEDT, merge aehrc/sparked-argo#384 (`on-demand-prod` `expireAfter: Never`). The node now counts as drifted, but the Drifted budget holds it until 19:00 AEDT.
      2. Confirm Argo synced it: `kubectl --context sparkey get nodepool on-demand-prod -o jsonpath='{.spec.template.spec.expireAfter}{"\n"}'` prints `Never`.
      3. Before 19:00 AEDT the same day, run the local Smile `terraform apply` of #123 (merged), and watch:
         ```sh
         kubectl --context sparkey get nodeclaims -l karpenter.sh/nodepool=on-demand-prod -w
         kubectl --context sparkey -n smile get pods -w
         curl -s -o /dev/null -w '%{http_code}\n' https://smile.sparked-fhir.com/aucore/fhir/DEFAULT/metadata
         ```
         The apply is a RollingUpdate (`maxSurge: 1, maxUnavailable: 0`) and a second Smile pod does not fit on the current node, so Karpenter launches a new node from the new template and the old pod serves until the new one is Ready. Expect one new NodeClaim, the new pod Ready, `200` throughout, then the old NodeClaim gone once empty: near-zero downtime (inferred, not observed). Nothing is left to drift at 19:00, so no evicting roll follows.
      4. Check: `kubectl --context sparkey get nodeclaims -l karpenter.sh/nodepool=on-demand-prod -o jsonpath='{.items[*].spec.expireAfter}{"\n"}'` prints `Never`.
      5. Do not reverse the order: an apply first and #384 later restarts Smile twice, the second time by eviction at 19:00 (about 7 to 10 minutes down). If #123 is not merged in time, merge #384 alone in the same slot: at 19:00 AEDT Karpenter launches the new node, then evicts the single pod (eviction ignores `maxSurge`), about 7 to 10 minutes down; announce it. Merged outside the slot, that roll starts within a few minutes of Argo's poll.
      6. If #384 is not merged by Mon 30 Nov, the fallback is a forceful roll at a chosen hour, `kubectl --context sparkey delete nodeclaim on-demand-prod-pr76v` (no pre-spun node, so a longer gap: node launch plus startup, up to the 20-minute startup probe ceiling), any time after 2026-11-11 17:00 AEDT so the new 30-day clock ends after the freeze. It is a cluster write: the operator's call. A #123 apply on its own also moves Smile to a fresh node whose 30 days end after the freeze, with no eviction.

  - anchor: event_start
    offset_days: -11
    task: "Sandbox service shown end to end on a scratch tenant: create, token, write, reset, expire."

  - anchor: event_start
    offset_days: -8
    task: "Sandbox go/no-go. Set `sandbox.status` to `open` or `cancelled` in the manifest, re-render, open the PR."
  - anchor: freeze_start
    offset_days: -3
    only_for: [2026-12-melbourne]
    task: |
      **Stacked PRs (one-off; read before merging the freeze PRs).** aehrc/sparked-argo keeps merged branches (`delete_branch_on_merge: false`), so GitHub does **not** retarget #383 and #386 when #382 merges. Merged as they stand they would land on the dead `freeze/event-sync-windows` branch, and after a squash of #382 they conflict. Right after #382 squash-merges, restack each one (whoever owns the #383 and #386 branches does this):
      ```sh
      # In an aehrc/sparked-argo checkout with a clean working tree:
      git fetch origin
      OLD=$(gh pr view 382 -R aehrc/sparked-argo --json headRefOid -q .headRefOid)   # #382's last head

      git switch freeze/karpenter-event-budgets && git merge --ff-only origin/freeze/karpenter-event-budgets   # #383
      git rebase --onto origin/main "$OLD"
      git push --force-with-lease origin freeze/karpenter-event-budgets
      gh pr edit 383 -R aehrc/sparked-argo --base main
      gh pr checks 383 -R aehrc/sparked-argo --watch           # wait for green before merging

      git switch freeze/renovate-pause && git merge --ff-only origin/freeze/renovate-pause                     # #386
      git rebase --onto origin/main "$OLD"
      git push --force-with-lease origin freeze/renovate-pause
      gh pr edit 386 -R aehrc/sparked-argo --base main
      gh pr checks 386 -R aehrc/sparked-argo --watch
      ```
      Tested 21 Nov on a simulated squash of #382: both rebases apply cleanly.
  - anchor: freeze_start
    offset_days: -3
    only_for: [2026-12-melbourne]
    task: |
      **Freeze PRs (one-off setup; merge by Wed 2 Dec).** None acts on the cluster before {{ freeze.start }}, except that #383's business-hours budget is live on merge (it rolls no node).
      1. Argo CD sync windows: merge aehrc/sparked-argo#382 (deny windows plus `scripts/event-freeze.py`). Check:
         ```sh
         kubectl --context sparkey -n argocd get appproject inferno sparked -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.syncWindows[*].schedule} {.spec.syncWindows[*].timeZone} {.spec.syncWindows[*].duration}{"\n"}{end}'
         ```
         Expect `{{ freeze.cron_local }} {{ freeze.timezone }} {{ freeze.duration }}` for both.
      2. Karpenter budgets: after #382 merges, restack aehrc/sparked-argo#383 (the "Stacked PRs" item: rebase, force-push, `gh pr edit 383 --base main`, green), then merge it. Check:
         ```sh
         kubectl --context sparkey get nodepools -o custom-columns=NAME:.metadata.name,BUDGETS:.spec.disruption.budgets
         ```
         Expect on `on-demand` and `spot`: `nodes:1`, the `0 21 * * *` 11h budget, and the `{{ freeze.cron_utc }}` {{ freeze.duration }} budget; `on-demand-overflow`: `nodes:1` and the `{{ freeze.cron_utc }}` {{ freeze.duration }} budget (Underutilized, Drifted), no business-hours budget; `on-demand-prod`: the `{{ freeze.cron_utc }}` {{ freeze.duration }} budget with no reasons; `spot-arm64`: the `0 21 * * *` budget. No NodeClaim should change.
      3. tx.dev preload overlay and Renovate pause: merge aehrc/sparked-argo#385 (the overlay, commented out; renders nothing new). After #382 merges, restack #386 (Renovate skips scheduled runs inside a rendered freeze; the "Stacked PRs" item: rebase, force-push, `gh pr edit 386 --base main`, green), then merge it. Check: `gh pr view 386 -R aehrc/sparked-argo --json baseRefName,state -q '.baseRefName+" "+.state'` prints `main MERGED`.

  - anchor: event_start
    offset_days: -6
    only_for: [2026-12-melbourne]
    task: |
      **Inferno promotion (one-off; by Wed 2 Dec).** The promotion is the existing promotion PR, hl7au/au-fhir-inferno#223 (`infra/helm/inferno/values-prod.yaml` moves prod to the image staging already runs); a repository admin marks it ready and merges it. `inferno-prod` renders `master`, so Argo CD syncs it within minutes of the merge. If a trunk build closes #223 as superseded before then, merge the promotion PR that replaced it and point `inferno.release.tracking` in the manifest at that PR. Then run the check in the next item.
  - anchor: event_start
    offset_days: -6
    task: |
      Inferno: the current promotion PR (the manifest's `inferno.release.tracking` link, now {{ inferno.release.tracking }}; repoint it first if a newer promotion PR has superseded that one) is merged. Check:
      ```sh
      kubectl --context sparkey -n argocd get app inferno-prod -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}{"\n"}'
      ```
      prints `Synced Healthy` and a `master` revision at or after that promotion PR's merge commit, and `{{ inferno.url }}/suites/api/test_suites` lists every suite in the manifest at the manifest's kit versions. Then set `inferno.release.status: live` and re-render.
  - anchor: sandbox_opens
    offset_days: 0
    task: "Merge the rendered guide; check that {{ sandbox.url }} accepts the access code (if the sandbox is open)."
  - anchor: sandbox_opens
    offset_days: 0
    task: "If the sandbox is open: run each Auth recipe in the guide verbatim against a sandbox (backend services, bearer token on each request, SMART App Launch with PKCE) and fix the guide where a step differs."
  - anchor: sandbox_opens
    offset_days: 0
    task: "If the sandbox is open: send the event access code to the organisers for their pre-event message to registered participants. In the Sparked FHIR Server topic on Zulip, say that the code is in that message and that anyone without it can ask in the topic for a direct message; answer each request with a Zulip direct message to the person who asked. Never post the code in a Zulip channel (chat.fhir.org channels can be web-public, and the code exists to keep crawlers off the sandbox front), and never commit it."
  - anchor: event_start
    offset_days: -6
    task: "Loader banner: feed `loader_banner` to the loader's values and check https://loader.sparked-fhir.com/api/v1/public/event shows it."
  - anchor: event_start
    offset_days: -6
    task: "Post the guide link in the Sparked FHIR Server topic on Zulip and ask the track leads to link it from their track pages."

  - anchor: freeze_start
    offset_days: -1
    task: |
      **Last checks before the freeze.**
      1. NodeClaim ages: any node created between {{ freeze.node_expiry_window }} expires inside the freeze.
         ```sh
         kubectl --context sparkey get nodeclaims -o custom-columns=NAME:.metadata.name,POOL:.metadata.labels.karpenter\\.sh/nodepool,CREATED:.metadata.creationTimestamp,EXPIRE:.spec.expireAfter
         ```
         Spot nodes usually go sooner; if one is still there, decide whether to roll it this evening (`kubectl delete nodeclaim <name>`, a cluster write).
      2. Ask whoever publishes to the `hl7au-dev` and `hl7au-fragments` syndication feeds to hold from {{ freeze.start }} to {{ freeze.end }}: a replica restart still runs the startup preload.
      3. Tell maintainers: no merges to aehrc/sparked-argo `main` and no Smile `terraform apply` from {{ freeze.start }} except emergencies; no Inferno promotion merges and no merges to hl7au/au-fhir-inferno `master` that change `infra/helm/inferno/` (prod renders `master`; the sync window holds them, but an emergency manual sync would ship them).
  - anchor: freeze_start
    offset_days: -1
    only_for: [2026-12-melbourne]
    task: "NodeClaim ages, as seen on 21 Nov: two spot nodes were in that range, `spot-v5nwq` (loader, expires Sun 6 Dec 11:03 AEDT) and `spot-jdswt` (one of the two main-gateway Envoy proxies and one of the two ontoserver-gw proxies, expires Fri 11 Dec 08:58 AEDT). If either is still there, decide whether to roll it this evening."

  - anchor: freeze_start
    offset_days: 0
    task: |
      **Between 09:00 and 16:00: pause the tx.dev preload.** (After the freeze starts, the `ontoserver` sync window blocks the automated sync; a manual sync still works.)
      ```sh
      # In an aehrc/sparked-argo checkout:
      git fetch origin
      git worktree add -b freeze/tx-dev-preload-on ../tx-preload-on origin/main
      cd ../tx-preload-on
      sed -i '' 's|^          # - \$values/apps/ontoserver/values-event-freeze.yaml$|          - $values/apps/ontoserver/values-event-freeze.yaml|' apps/ontoserver.yaml
      git diff --stat   # 1 file, 1 line
      git commit -am "Pause tx.dev's nightly preload for the event freeze" && git push -u origin HEAD
      gh pr create --fill && gh pr merge --squash --delete-branch
      ```
      Both replicas roll one at a time (about 2.5 minutes each). Each roll runs the startup preload, so tx.dev's content is fixed at this switch, not when the freeze starts. If `ontoserver-statefulset-1` (rolled first) fails to start, Ontoserver rejected `"-"`: the roll stops with pod 0 still serving; revert the switch. Check:
      ```sh
      kubectl --context sparkey -n ontoserver get sts ontoserver-statefulset -o jsonpath='{.spec.template.spec.containers[?(@.name=="ontoserver-ontoserver")].env[?(@.name=="atom.preload.schedule.cron")].value}{"\n"}'   # prints -
      kubectl --context sparkey -n ontoserver get pods   # both Ready
      curl -s -o /dev/null -w '%{http_code}\n' 'https://tx.dev.hl7.org.au/fhir/CodeSystem/$validate-code?url=http://snomed.info/sct&code=38341003'   # 200
      ```
  - anchor: freeze_start
    offset_days: 0
    task: "Freeze starts at {{ freeze.start }}. Nothing to do at that moment: the Argo CD sync windows, Karpenter event budgets and Renovate skip all start on their own."
  - anchor: freeze_start
    offset_days: 0
    task: |
      **From five minutes after the freeze starts: confirm.**
      - Argo CD (v3.6.2 sets no Application condition when a window blocks auto-sync or self-heal; it logs it once per reconcile):
        ```sh
        kubectl --context sparkey -n argocd logs sts/argocd-application-controller --since=10m \
          | grep 'Sync prevented by sync window' | grep -c 'application=inferno-prod'   # more than 0
        argocd login <the sparkey Argo CD host> --sso --grpc-web   # once per session; the host is in aehrc/sparked-argo docs/argocd.md
        argocd app get inferno-prod | grep 'SyncWindow:'   # Manual Allowed (Sync Allowed = no active window)
        ```
        Repeat the log grep with `application=ontoserver` and `application=smilecdr-routes` for the `sparked` project.
      - Karpenter: in Grafana Explore (Mimir), `karpenter_nodepools_allowed_disruptions{nodepool=~"on-demand|on-demand-prod|spot"}` drops to 0 for the frozen reasons.
      - Smile: no `terraform apply` until the freeze ends (convention; Smile is not in Argo CD).
      - Inferno: no promotion merge until the freeze ends. `inferno-prod` renders `master`, and the `inferno` sync window keeps it on the revision it had at the freeze start: the log grep above shows the window holding it.
  - anchor: freeze_start
    offset_days: 0
    task: |
      **During the freeze (keep for reference).**
      - Emergency change to a frozen app: merge the fix, then sync it by hand (the windows set `syncOverrun: true`, so no automated sync is left stuck from the freeze start to terminate first): Argo CD UI, the Application, Sync (allowed because every window sets `manualSync: true`). With kubectl only:
        ```sh
        kubectl --context sparkey -n argocd patch application <app> --type merge \
          -p '{"operation":{"initiatedBy":{"username":"<you>"},"sync":{"syncStrategy":{"hook":{}}}}}'
        ```
      - Emergency Inferno rollback: revert the last promotion PR on hl7au/au-fhir-inferno `master` (a revert PR puts the previous image back in `infra/helm/inferno/values-prod.yaml`), merge it, then sync `inferno-prod` by hand. A manual sync ships everything on `master` since the freeze started, so check `git log` for `infra/helm/inferno/` first.
      - Emergency dependency bump: Actions, Renovate, Run workflow, tick `ignore_freeze`.
      - Emergency node repack: karpenter-config is not in a window; delete the event block from the NodePool and merge.
      - Lift the whole freeze early: merge `python3 scripts/event-freeze.py clear` (the clear step at the freeze end) and resume the tx.dev preload. Do not revert aehrc/sparked-argo#382 to lift it: once #386 is merged, that breaks every scheduled Renovate run. To remove the tooling, revert #386, then #383, then #382.
      - Renovate's scheduled runs inside the freeze should show as skipped: `gh run list -R aehrc/sparked-argo --workflow renovate.yaml -L 2`.
  - anchor: freeze_start
    offset_days: 1
    only_for: [2026-12-melbourne]
    task: |
      **After 02:00 AEDT: Ontoserver logs show no `Commenced scheduled preload job`.** Each replica logs that line (`au.csiro.ontoserver.jobs.PreloadScheduler`) when the nightly cron fires at 15:00 UTC; the startup preload does not log it. Kubelet keeps only about two hours of Ontoserver logs, so ask Loki through the API server proxy (read-only):
      ```sh
      kubectl --context sparkey get --raw "/api/v1/namespaces/monitoring/services/lgtm-distributed-loki-gateway:80/proxy/loki/api/v1/query_range?query=%7Bnamespace%3D%22ontoserver%22%7D%20%7C%3D%20%22Commenced%20scheduled%20preload%20job%22&start=2026-12-04T14:55:00Z&end=2026-12-04T15:30:00Z&limit=10" | jq '[.data.result[].values[]] | length'
      ```
      Expect `0`. A normal night prints `2` (one per replica; checked for 19 and 20 Nov on 21 Nov). If it prints anything else, the cron is still on: check the freeze-start `kubectl get sts` output and sync `ontoserver` by hand.

  - anchor: event_start
    offset_days: -1
    task: "Run the smoke suite from CI; every status check green."
  - anchor: event_start
    offset_days: -1
    task: "Warm the validator: one `$validate?profile=<canonical>|<version>` per IG version in the version map on {{ server.sparked.fhir_base }}."
  - anchor: event_start
    offset_days: -1
    task: "Print the guide with the access code (`EVENT_ACCESS_CODE=... python scripts/render_event.py --print-copy <file outside the repo> events/{{ event.id }}.yaml`) and put the code on the venue slides. Never commit the code."
  - anchor: event_start
    offset_days: -1
    task: "Run `--check-links` once more."

  - anchor: event_start
    offset_days: 0
    task: "Each event morning: status checks, Inferno suite list, sandbox count against the cap of {{ sandbox.max_live }}; watch the Zulip topics in the guide's Help section and answer access code requests by direct message only; note problems for the retro."
  - anchor: event_start
    offset_days: 1
    task: "Morning checks as on day 1."
  - anchor: event_end
    offset_days: 0
    task: "Morning checks as on day 1."
  - anchor: sandbox_creation_closes
    offset_days: 0
    task: "Sandbox creation closes at {{ sandbox.creation_closes }}; check the front refuses new sandboxes."

  - anchor: freeze_end
    offset_days: 0
    task: "Freeze ends at {{ freeze.end }}. Nothing to do at that moment: the sync windows and event budgets end on their own."
  - anchor: freeze_end
    offset_days: 0
    task: |
      **After the freeze ends: resume the tx.dev preload.** (Before then the window holds the sync.)
      ```sh
      # In an aehrc/sparked-argo checkout:
      git fetch origin
      git worktree add -b freeze/tx-dev-preload-off ../tx-preload-off origin/main
      cd ../tx-preload-off
      sed -i '' 's|^          - \$values/apps/ontoserver/values-event-freeze.yaml$|          # - $values/apps/ontoserver/values-event-freeze.yaml|' apps/ontoserver.yaml
      git commit -am "Resume tx.dev's nightly preload after the event freeze" && git push -u origin HEAD
      gh pr create --fill && gh pr merge --squash --delete-branch
      ```
      Check that the same `kubectl get sts` command as at the freeze start prints `0 0 15 * * *` and both pods are Ready.
  - anchor: freeze_end
    offset_days: 0
    task: |
      **Clear the rendered freeze blocks** (the crons recur next year otherwise; the sparked-argo render CI turns every PR red from the freeze end until this lands):
      ```sh
      # In an aehrc/sparked-argo checkout:
      git fetch origin
      git worktree add -b freeze/clear-{{ event.id }} ../freeze-clear origin/main
      cd ../freeze-clear
      python3 scripts/event-freeze.py clear && python3 scripts/event-freeze.py check
      git commit -am "Clear the {{ event.id }} event freeze blocks" && git push -u origin HEAD
      gh pr create --fill
      ```
      Merge after review. Check: `kubectl --context sparkey -n argocd get appproject inferno sparked -o jsonpath='{.items[*].spec.syncWindows}'` prints nothing, and the NodePools lose the `{{ freeze.cron_utc }}` budget (the business-hours budget stays).
  - anchor: freeze_end
    offset_days: 0
    task: "Tell maintainers the freeze is over and release the feed publishing hold. Renovate resumes on its own; work through its backlog one PR at a time. For the next event, run `python3 scripts/event-freeze.py render --manifest <raw URL of events/<event>.yaml>` in a sparked-argo worktree and merge that PR before its freeze (sparked-argo docs/event-freeze.md)."
  - anchor: freeze_end
    offset_days: 0
    task: "Retro from the status history, the sandbox register and the Zulip topics."

  - anchor: sandbox_expires
    offset_days: 0
    task: "Sandbox expiry ran {{ sandbox.expires }}: every event sandbox is disabled and its data deleted; retire the access code."
  - anchor: sandbox_expires
    offset_days: 0
    task: "Turn the loader banner off; close this issue."
