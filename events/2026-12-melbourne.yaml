    use_for: A bug in the Sparked FHIR server configuration

known_issues:
  - id: smart-jwks-redirect
    title: The jwks_uri in SMART discovery redirects to a sign-in page
    detail: "`jwks_uri` in `.well-known/smart-configuration` (`/aucore/smartauth/.well-known/jwks.json`) answers 302 to `/aucore/smartauth/signin`, so a client that follows it cannot check id_token signatures."
    workaround: "Use the `jwks_uri` from the OpenID configuration instead: `https://smile.sparked-fhir.com/aucore/smartauth/jwk`."
    last_checked: "2026-11-21"
  - id: smartauth-discovery-path
    title: SMART discovery lives under the FHIR base, not under smartauth
    detail: "`/aucore/smartauth/.well-known/smart-configuration` redirects to the sign-in page. Older Sparked handouts gave that address."
    workaround: "Use `<FHIR base>/.well-known/smart-configuration`, for example `https://smile.sparked-fhir.com/aucore/fhir/DEFAULT/.well-known/smart-configuration`."
    last_checked: "2026-11-21"
  - id: unversioned-profile
    title: An unversioned profile resolves to the ballot
    detail: "On Sparked, `$validate?profile=http://hl7.org.au/fhir/core/StructureDefinition/au-core-patient` validates against 3.0.0-ballot1."
    workaround: "Add the version to the canonical (`...au-core-patient|2.1.0-draft`) when you want another loaded version."
    last_checked: "2026-11-21"
  - id: validate-without-profile
    title: $validate without a profile checks base FHIR only
    detail: "The server does not apply AU Core profiles by default; a request without `profile` reports base FHIR R4 issues only."
    workaround: "Always add `?profile=<canonical>|<version>`."
    last_checked: "2026-11-21"
  - id: au-core-2-not-on-sparked
    title: AU Core 2.0.0 and AU Base 6.0.0 are not on Sparked
    detail: "`$validate?profile=...|2.0.0` on Sparked returns \"Invalid profile. Failed to retrieve profile\"."
    workaround: Validate against AU Core 2.0.0 with the HL7 FHIR Validator (`-ig hl7.fhir.au.core#2.0.0`) or against the HL7 AU reference server.
    last_checked: "2026-11-21"
  - id: hl7-reference-validate-timeouts
    title: $validate on fhir.hl7.org.au timed out
    detail: "On 21 Nov 2026 every `$validate` request to fhir.hl7.org.au returned HTTP 504 after about a minute; reads and searches answered. That server is not run by Sparked."
    workaround: Use the HL7 FHIR Validator locally with `-ig hl7.fhir.au.core#2.0.0`.
    last_checked: "2026-11-21"
  - id: validate-cold-start
    title: The first $validate after a quiet spell can time out
    detail: The first `$validate` on Sparked after an idle period has been seen to return HTTP 504 after about 15 seconds while the validator loads; the next request answers in well under a second.
    workaround: Retry once.
    last_checked: "2026-11-21"
  - id: everything-anonymous
    title: $everything is not available anonymously
    detail: "`GET Patient/<id>/$everything` on DEFAULT returns 403 \"Access denied\" without a token."
    workaround: "Use `Patient/<id>/$summary` (AU Patient Summary document) or searches with `patient=<id>`."
    last_checked: "2026-11-21"
  - id: counts-disabled
    title: Resource counts are switched off
    detail: "`_summary=count` and `_total=accurate` return HTTP 400 (HAPI-2038, HAPI-2037)."
    workaround: Page through the search results instead.
    last_checked: "2026-11-21"
  - id: binary-not-served
    title: Binary is not served on DEFAULT
    detail: "`Binary` is not an enabled resource type on the Sparked server (HAPI-0302), so the two AU Core PDF report attachments are not loaded."
    workaround: Use the files in hl7au/au-fhir-test-data directly.
    last_checked: "2026-11-21"
  - id: inferno-default-target
    title: The AU Core Test Kit points at fhir.hl7.org.au by default
    detail: "The kit's FHIR Endpoint input defaults to the HL7 AU reference server, not to Sparked. Four of its default ids (Location `au-hospital`, Organization `dva-au` and `organization-medical-center-tc`, PractitionerRole `cardiologist-sallie-sutherland`) are not on Sparked."
    workaround: "Set FHIR Endpoint to your own server. For a dry run against Sparked, use its FHIR base and remove those four ids."
    last_checked: "2026-11-21"
  - id: inferno-sessions-open
    title: Inferno sessions are open to anyone with the link
    detail: Session URLs need no login, results stay for about nine weeks, and resources the tests fetch from your server are kept with the session.
    workaround: Point Inferno only at servers holding synthetic data, and share session links only with people you want to see the results.
    last_checked: "2026-11-21"

# The event block for loader.sparked-fhir.com. The loader reads the same four
# fields from its own helm values (event: enabled, title, message, date); a
# follow-up change feeds these values to it so git sets the banner.
loader_banner:
  enabled: true
  title: the HL7 Australia WGM and Melbourne FHIR Connectathon
  message: "The AU Core Sparked FHIR server is loaded with the HL7 AU test data set for the HL7 Australia WGM and Melbourne FHIR Connectathon, 8 to 10 December 2026. Participant guide: https://github.com/aehrc/sparked-fhir-server-configuration/blob/main/docs/participants/2026-12-melbourne.md. Reach out to the Sparked team on chat.fhir.org with any issues."
  date: "2026-12-08"

outputs:
  guide: docs/participants/2026-12-melbourne.md
  checklist: docs/operators/events/2026-12-melbourne-checklist.md
