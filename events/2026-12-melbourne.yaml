  - name: "Zulip: #australia > AU eRequesting Track - Melbourne FHIR Connectathon #28"
    url: https://chat.fhir.org/#narrow/channel/179173-australia/topic/AU.20eRequesting.20Track.20-.20Melbourne.20FHIR.20Connectathon.20.2328
    use_for: AU eRequesting track questions, including which server the track uses
  - name: "Zulip: #australia > AU Patient Summary Track - Melbourne FHIR Connectathon #28"
    url: https://chat.fhir.org/#narrow/channel/179173-australia/topic/AU.20Patient.20Summary.20Track.20-.20Melbourne.20FHIR.20Connectathon.20.2328
    use_for: AU Patient Summary track questions
  - name: "Zulip: #australia > SMART App Launch Track - Melbourne FHIR Connectathon #28"
    url: https://chat.fhir.org/#narrow/channel/179173-australia/topic/SMART.20App.20Launch.20Track.20-.20Melbourne.20FHIR.20Connectathon.20.2328
    use_for: SMART App Launch track questions
  - name: "Zulip: #australia > Inferno Test Kit feedback and queries"
    url: https://chat.fhir.org/#narrow/channel/179173-australia/topic/Inferno.20Test.20Kit.20feedback.20and.20queries
    use_for: Inferno and the AU test kits
  - name: Event page (HL7 AU Confluence)
    url: https://confluence.hl7.org/pages/viewpage.action?pageId=494872196
