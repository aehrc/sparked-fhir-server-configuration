name: Implementation Guide Release Request
description: Request to add or update a FHIR Implementation Guide on the Sparked FHIR Server
title: "[IG Release]: "
labels: ["ig-release", "needs-review"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Implementation Guide Release Request
        Use this template to request deployment of a new or updated FHIR Implementation Guide (IG) to the Sparked FHIR Server.

        **For non-technical users**: Please fill out as much as you can. Our team will help with technical details.

  - type: input
    id: ig-name
    attributes:
      label: Implementation Guide Name
      description: What is the name of the IG? (e.g., "International Patient Summary", "AU eRequesting")
      placeholder: "International Patient Summary"
    validations:
      required: true

  - type: input
    id: ig-version
    attributes:
      label: IG Version
      description: Which version should be deployed? (e.g., "3.0.0", "1.2.0-ballot")
      placeholder: "3.0.0"
    validations:
      required: true

  - type: input
    id: ig-package-id
    attributes:
      label: NPM Package ID
      description: The NPM package identifier (e.g., "hl7.fhir.uv.ips"). This can be found in the IG's package.json file.
      placeholder: "hl7.fhir.uv.ips"
    validations:
      required: true

  - type: input
    id: ig-url
    attributes:
      label: IG URL or Documentation Link
      description: Link to the IG specification or documentation
      placeholder: "https://hl7.org/fhir/uv/ips/"
    validations:
      required: false

  - type: input
    id: package-url
    attributes:
      label: Custom Package URL
      description: |
        Optional. A direct URL to the package `.tgz` to load, used instead of the default FHIR package registry.

        Leave blank for normal packages; most IGs (including `-draft`/`-preview` versions) resolve automatically from `packages.fhir.org`.

        Provide a URL only when the package is **not** on the registry, or when you must override a stale/incorrect registry copy with a specific publication build.
      placeholder: "https://hl7.org/fhir/uv/ips/2.0.1/package.tgz"
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      description: How urgent is this request?
      options:
        - Low - Can wait for next scheduled release
        - Medium - Needed within 2 weeks
        - High - Needed within 1 week
        - Critical - Blocking work
    validations:
      required: true

  - type: dropdown
    id: request-type
    attributes:
      label: Request Type
      description: Is this a new IG or an update to an existing one?
      options:
        - New IG - Not currently on the server
        - Update - Upgrading existing IG to new version
        - Rollback - Revert to previous version
    validations:
      required: true

  - type: checkboxes
    id: target-nodes
    attributes:
      label: Target SmileCDR Nodes
      description: |
        Which SmileCDR nodes should this IG package be deployed to?

        The `aucore` node is the **Sparked Dev FHIR Server** on
        `smile.sparked-fhir.com`. This is not the HL7 AU reference server at `fhir.hl7.org.au`,
        which is a separate system (see the repository Governance notes).

        **Node Descriptions:**
        - **aucore**: AU Core node of the Sparked Dev FHIR Server (`smile.sparked-fhir.com/aucore`)

        The `ereq` and `hl7au` nodes were decommissioned on 2026-08-02. AU eRequesting is no
        longer run under Sparked, so eRequesting IG releases are not deployed here.
      options:
        - label: aucore (Sparked dev AU Core node)
          required: false
  - type: checkboxes
    id: deployment-options
    attributes:
      label: Deployment Preferences
      description: |
        How would you like the deployment to be handled after approval?

        **Deploy Immediately**: Request that deployment happens automatically after the change is previewed and approved.
        - ✅ Fast (2-5 minutes after PR merge)
        - ✅ No manual intervention needed
        - ⚠️ Repo admins will verify configuration before approving
      options:
        - label: Request immediate deployment after change is approved and merged
          required: false

  - type: textarea
    id: test-data
    attributes:
      label: Test Data or Examples Requirements
      description: |
        Do you need test data or specific examples loaded for this IG?
        - How much test data? (e.g., "50 sample patients", "minimal examples")
        - How often should it refresh?
      placeholder: |
        - Need latest branch of https://github.com/hl7au/au-fhir-test-data 
        - Need /examples folder from the IPS IG
    validations:
      required: false

  - type: checkboxes
    id: package-options
    attributes:
      label: Package Installation Options
      description: |
        Request specific configuration for how this IG package should be loaded (leave unchecked for defaults)

        **installMode**: Controls whether the package is just stored or also installed
        - Unchecked (default): `STORE_ONLY` - Package is stored but not automatically installed
        - Checked: `STORE_AND_INSTALL` - Package is both stored and installed

        **fetchDependencies**: Controls whether to automatically fetch package dependencies
        - Unchecked (default): `false` - Dependencies not fetched
        - Checked: `true` - Dependencies automatically fetched
      options:
        - label: Request package be installed automatically (STORE_AND_INSTALL)
        - label: Request dependencies be fetched automatically

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context or Acceptance Criteria
      description: |
        Any additional context or configuration changes that might be required.
      placeholder: |
        Example Acceptance Criteria:
        - Can retrieve IG resources via FHIR API
        - StructureDefinitions validate correctly
        - Sample test data loads without errors
        - Documentation updated with new endpoints
        Example additional details:
        - New modules, endpoints or access requirements
        - Custom packageUrl if not using packages.fhir.org
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### What happens next?
        1. **Repo admins will review** this request and add implementation details
        2. **You'll receive updates** as status labels change: `needs-review` → `approved` → `in-progress` → `deployed`
        3. **Automated PR will be created** if approved for automation
        4. **Deployment will occur** either immediately after PR merge (if requested) or on next server restart
        5. **You'll be notified** when deployment is complete and asked to verify it meets your requirements
