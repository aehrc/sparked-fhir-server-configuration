# GitHub Labels Configuration - source of truth for the label-sync workflow
# (.github/workflows/sync-labels.yml). Synced NON-DESTRUCTIVELY: labels absent
# here are never pruned. scripts/setup-labels.sh must be kept in sync with this file.
#
# Do NOT rename these trigger labels - the issue automation matches them as exact
# strings and renaming would silently break it:
#   ig-release, tx-content, configuration, operations, smart-client,
#   ready-for-automation, approved, auto-pr-created, deploy-immediately

# Request Types
- name: "ig-release"
  color: "0366d6"
  description: "Implementation Guide release request"

- name: "configuration"
  color: "1d76db"
  description: "Configuration change request"

- name: "operations"
  color: "5319e7"
  description: "Operational request (data load, expunge, etc.)"

- name: "tx-content"
  color: "006b75"
  description: "Terminology server content change request"

# Status Labels (flow: needs-review → approved → ready-for-automation → in-progress → deployed → complete)
- name: "needs-review"
  color: "fbca04"
  description: "Awaiting technical review"

- name: "needs-revision"
  color: "fbef2c"
  description: "Returned to requestor for changes before review can continue"

- name: "approved"
  color: "0e8a16"
  description: "Request approved, ready to implement"

- name: "in-progress"
  color: "0075ca"
  description: "Work in progress"

- name: "deployed"
  color: "28a745"
  description: "Changes deployed, awaiting verification"

- name: "complete"
  color: "28a745"
  description: "Completed and verified"

- name: "blocked"
  color: "d93f0b"
  description: "Blocked by external dependency"

# Priority Labels
- name: "priority:critical"
  color: "b60205"
  description: "Critical - Blocking work"

- name: "priority:high"
  color: "d93f0b"
  description: "High - Needed within 1 week"

- name: "priority:medium"
  color: "fbca04"
  description: "Medium - Needed within 2 weeks"

- name: "priority:low"
  color: "c5def5"
  description: "Low - Can wait for next scheduled release"

# General Labels
- name: "bug"
  color: "d73a4a"
  description: "Something is not working"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or improvement request"

- name: "automation"
  color: "bfdadc"
  description: "Request to automate an operation"

- name: "documentation"
  color: "0075ca"
  description: "Documentation improvements or requests"

- name: "question"
  color: "cc317c"
  description: "Question or help request"

- name: "duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue"

- name: "wontfix"
  color: "ffffff"
  description: "Will not be implemented"

# Automation Labels
- name: "ready-for-automation"
  color: "0e8a16"
  description: "Issue has all info needed for automated PR generation"

- name: "auto-pr-created"
  color: "1d76db"
  description: "Automated PR has been created for this issue"

- name: "needs-manual-intervention"
  color: "d93f0b"
  description: "Automation failed, requires manual implementation"

- name: "deploy-immediately"
  color: "d93f0b"
  description: "Request immediate deployment after PR merge"

# SMART Client Registration Labels
- name: "smart-client"
  color: "d876e3"
  description: "SMART App / OIDC client registration request"

- name: "auto-registered"
  color: "1d76db"
  description: "Client has been automatically registered on SmileCDR"
