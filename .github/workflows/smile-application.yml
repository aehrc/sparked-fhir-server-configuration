name: 'Smile Configuration Deployment (DEPRECATED)'

# DEPRECATED / DISABLED (2026-07-16): terraform plan/apply no longer runs in CI.
#
# This repository is public. Running `terraform plan`/`apply` against the live
# prod infrastructure in CI publishes plan output (secret ARNs, resource IDs,
# account/topology detail) to PR comments, job summaries, artifacts, and run
# logs, all world-readable on a public repo. Terraform is therefore applied
# LOCALLY only, using the gitignored terraform/backend.hcl and
# terraform/terraform.tfvars. See terraform/REMEDIATION.md for the procedure.
#
# This file is kept (not deleted) as a reference for anyone reproducing the
# setup in their own account, and so it can be re-enabled later behind a
# private repo or a sanitized, non-leaking plan step. All triggers below are
# neutralized and both jobs are guarded with `if: ${{ false }}` so nothing runs.
#
# ---- original design notes (retained for reference) ----
# Plan on PRs and on push to main; apply only on a manual, confirmed dispatch.
#
# Apply gate: this repo lives in a free-plan org, which does not support branch
# protection or environment required-reviewers on private repos (the branch
# protection and environment protection-rule APIs both return an "upgrade the
# billing plan" error). So apply is NOT auto-run on merge. Instead it runs only
# via workflow_dispatch when the operator types APPLY, and only when the plan
# reports changes. The effective gate is "who can Run this workflow and type
# APPLY" (write access). Push-to-main runs plan only, for post-merge drift
# visibility; it never applies.
#
# The steps are inlined rather than calling the reusable templates in
# aehrc/sparked-infrastructure: that repo is private and this repo was public,
# and GitHub does not allow a public repo to consume a private repo's reusable
# workflows ("workflow was not found"). The step sequence mirrors
# template-terraform-plan.yml / template-terraform-apply.yml; keep them roughly
# in sync when those templates change.
#
# backend.hcl and terraform.tfvars are gitignored, so the state bucket and the
# three no-default variables are injected from repo variables (none are secrets:
# a bucket name, a Secrets Manager ARN, an IAM role name). AWS auth is OIDC.

# Auto-triggers are disabled: terraform is applied locally, not in CI (see banner
# above). Only manual dispatch remains, and the jobs themselves are inert.
#  pull_request:
#    paths:
#      - 'module-config/**'
#      - 'terraform/**'
#  push:
#    branches:
#      - main
#    paths:
#      - 'module-config/**'
#      - 'terraform/**'
on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: 'DEPRECATED: this workflow is disabled; terraform is applied locally. See terraform/REMEDIATION.md.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write      # request the OIDC JWT
  contents: read       # actions/checkout
  pull-requests: write # comment the plan on PRs

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    # DISABLED: terraform runs locally, not in CI. This guard makes the job inert
    # even if manually dispatched. Remove it (and restore the triggers above) only
    # if plan output is moved off public surfaces.
    if: ${{ false }}
    # Defaults to GitHub-hosted; set repo var CI_RUNNER to use a self-hosted runner.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      tfplanExitCode: ${{ steps.tf-plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          # Module v9.0.2 requires Terraform >= 1.14.3; matches the committed lock file and local applies.
          terraform_version: "1.15.6"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      # No -upgrade: respect the committed .terraform.lock.hcl. backend.hcl is
      # gitignored, so inject the state bucket (region + key live in the backend block).
      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.63.1

      # Error severity only; the stack carries pre-existing warning-level findings.
      - name: TFLint
        run: tflint --format compact --minimum-failure-severity=error

      # terraform.tfvars is gitignored, so pass the three no-default vars.
      - name: Terraform Plan
        id: tf-plan
        run: |
          export exitcode=0
          terraform plan \
            -var="s3_bucket_name=${{ vars.S3_BUCKET }}" \
            -var="cdr_regcred_secret_arn=${{ vars.CDR_REGCRED_SECRET_ARN }}" \
            -var="smilecdr_iam_role_name=${{ vars.SMILECDR_IAM_ROLE_NAME }}" \
            -detailed-exitcode -no-color -out main.tfplan || export exitcode=$?
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          echo "exitcode=$exitcode"
          if [ "$exitcode" -eq 1 ]; then
            echo "Terraform Plan Failed!"
            exit 1
          fi
          exit 0

      - name: Publish Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-smile-app-prod
          path: |
            terraform/main.tfplan
            terraform/builds/

      # Render the saved plan for humans. Both consumers read it straight from the
      # plan file and are size-capped: a large plan (e.g. a major RDS engine
      # upgrade, which cascades to many dependent resources) otherwise passes the
      # whole plan as an env var and overflows the runner's arg/env limit (E2BIG,
      # "Argument list too long"), and would also blow the 65 KB PR-comment and
      # 1 MB step-summary caps. These steps are cosmetic, so continue-on-error keeps
      # a rendering failure from failing the gate, which is driven by the plan exit
      # code and the uploaded tfplan artifact, not by the summary text.
      - name: Publish Terraform Plan to Task Summary
        continue-on-error: true
        run: |
          {
            echo "## Terraform Plan Output (smile-app-prod)"
            echo '```terraform'
            terraform show -no-color main.tfplan | head -c 900000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push Terraform Output to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const full = execSync('terraform show -no-color main.tfplan', {
              cwd: 'terraform', maxBuffer: 64 * 1024 * 1024,
            }).toString();
            const LIMIT = 60000;
            const truncated = full.length > LIMIT;
            const plan = truncated ? full.slice(0, LIMIT) : full;
            const note = truncated
              ? '\n\n_Plan truncated for this comment; see the job summary or the `tfplan-smile-app-prod` artifact for the full output._'
              : '';
            const body = `## Terraform Plan Output (smile-app-prod)\n<details><summary>Click to expand</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n</details>${note}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  terraform-apply:
    name: 'Terraform Apply'
    needs: [terraform-plan]
    # Manual gate: apply runs only on a workflow_dispatch where the operator
    # typed APPLY, and only when the plan reported changes (exitcode == 2).
    # A plain dispatch (blank confirm_apply) or a push/PR is plan-only. There is
    # no environment reviewer gate: the free org plan rejects environment
    # protection rules on private repos (see the header comment).
    # DISABLED: terraform runs locally, not in CI. `needs: terraform-plan` (itself
    # inert) plus this always-false guard keeps apply from ever running.
    if: ${{ false }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          # Must match the plan job so the saved plan is applied by a compatible CLI.
          terraform_version: "1.15.6"

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-smile-app-prod
          path: terraform

      # Applies exactly the reviewed plan; if state moved since the plan was
      # created, terraform aborts rather than applying a stale diff.
      - name: Terraform Apply
        run: terraform apply -auto-approve main.tfplan
