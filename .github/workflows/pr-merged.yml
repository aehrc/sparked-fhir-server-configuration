name: PR Merged

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ============================================================================
  # JOB: Update related issue after auto-generated PR is merged
  # ============================================================================
  post-merge-update:
    name: Update Issue After PR Merge
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'auto-pr-created')

    steps:
      - name: Extract issue number from PR body
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';

            // Extract issue number from "Related to #123" or "Issue #123"
            const issueMatch = prBody.match(/#(\d+)/);
            const issueNumber = issueMatch ? issueMatch[1] : null;

            core.setOutput('issue_number', issueNumber);

      # Both IG release and TX content change PRs carry auto-pr-created, but
      # only a change to module-config/ or deploy/ reaches a live service on
      # merge (Argo CD rolls Smile). The changed paths decide which notice is
      # posted, so a TX requester is never told Smile is rolling, and a PR that
      # touches both keeps the TX hand steps alongside the Smile notice.
      - name: Classify the merged change
        id: classify
        if: steps.extract.outputs.issue_number
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const paths = files.map(f => f.filename);
            const under = prefixes => paths.some(p => prefixes.some(prefix => p.startsWith(prefix)));

            const smile = under(['module-config/', 'deploy/']);
            const tx = under(['terminology-servers/']);
            const kind = smile && tx ? 'both' : smile ? 'smile' : tx ? 'tx' : 'other';
            console.log(`Changed paths: ${paths.join(', ')}`);
            console.log(`Notice kind: ${kind}`);
            core.setOutput('kind', kind);

      # No deployment is dispatched from here. Since 2026-11-26 the Argo CD
      # Application `smilecdr` (aehrc/sparked-argo apps/smilecdr.yaml) syncs
      # main automatically, so the merge is the deploy: the new pod installs
      # the packages from its seed config on boot. A Re/load IG Packages run
      # dispatched at the merge would stack a second install on that one
      # (docs/runbooks/ig-release.md, step 2.3) and could not wait for the
      # roll, because a GitHub-hosted runner cannot see the cluster.
      - name: Post deployment notice
        if: steps.extract.outputs.issue_number
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          KIND: ${{ steps.classify.outputs.kind }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const runbook = 'https://github.com/aehrc/sparked-fhir-server-configuration/blob/main/docs/runbooks/ig-release.md';

            const smileSection = `### The merge deploys it
            Argo CD syncs the Smile workload (the \`smilecdr\` Application) from \`main\` on its own, so nobody needs to run anything:
            - **Time**: outside an event change freeze, Argo CD starts a new Smile pod within about 2 minutes, and the new pod can take up to 20 minutes to be ready
            - **Packages**: the new pod installs the packages from its seed config as it starts
            - **Downtime**: none expected (the old pod serves until the new one is ready)

            ### After the roll
            Once the roll has finished (one pod, Ready), a repo admin checks the node, including a read-only "Re/load IG Packages" dry run that lists package drift both ways, and then labels this issue \`deployed\`. A live "Re/load IG Packages" run follows only if the post-roll dry run shows a missing package version, and never during the roll: the new pod is already installing the same packages, and a second install stacked on top of it is unsafe.

            ### Event freezes
            During an event change freeze the automated sync is held, so a merge to \`module-config/\` or \`deploy/\` ships only with a manual sync, or by itself when the freeze ends. That is why such merges are not made during a freeze, except a fix for an outage.`;

            const txSteps = `- **tx.dev**: a repo admin adds the matching entry to the \`hl7au-dev\` Atomio feed by hand ([IG release runbook step 1.1](${runbook}#step-1-1))
            - **tx.hl7**: a repo admin hands the change to its HL7 AU owners ([runbook step 7.2](${runbook}#step-7-2))`;
            const txFreeze = `During an event change freeze no new entry goes into the \`hl7au-dev\` feed ([runbook constraint 9](${runbook}#4-ordering-constraints)).`;

            const txSection = `### Merging changes nothing live
            This change touches only the terminology server values, and no feeder syncs either server (the tx-dev feeder was decommissioned on 2026-09-29), so nothing rolls and Smile is not affected:
            ${txSteps}

            Only the line for the servers this PR targets applies. A repo admin labels this issue \`deployed\` once the server has the change.

            ### Event freezes
            ${txFreeze}`;

            const bothTxSection = `### Terminology servers
            This PR also changes the terminology server values. No feeder syncs either server (the tx-dev feeder was decommissioned on 2026-09-29), so that part is done by hand:
            ${txSteps}

            Only the line for the servers this PR targets applies. ${txFreeze} A repo admin labels this issue \`deployed\` only once Smile has passed its post-roll checks and the terminology server has the change.`;

            const otherSection = `### Deployment
            This PR changed nothing under \`module-config/\`, \`deploy/\` or \`terminology-servers/\`, so the merge rolls no server. A repo admin will follow up here and label this issue \`deployed\` once the change is live.`;

            const kind = process.env.KIND;
            const sections = {
              smile: smileSection,
              tx: txSection,
              both: `${smileSection}\n\n${bothTxSection}`,
              other: otherSection
            };
            const section = sections[kind] || otherSection;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## PR #${prNumber} Merged Successfully

            Your requested changes have been approved and merged into the main branch.

            **What was merged:**
            ${prTitle}

            ${section}

            ---

            When this issue is labelled \`deployed\`, please verify the deployment meets your acceptance criteria and comment here with your results. A repo admin will then mark the issue as complete.

            **Note**: Please do not close this issue manually. It will remain open for verification.`
            });

      - name: Handle failure
        if: failure() && steps.extract.outputs.issue_number
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          KIND: ${{ steps.classify.outputs.kind }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const kind = process.env.KIND;

            const smileLine = 'The merge itself still deploys the change: Argo CD syncs `main` automatically and rolls Smile, outside an event change freeze';
            const txLine = 'the tx.dev feed entry is still added by hand (IG release runbook step 1.1), and a tx.hl7 change still goes to its owners';

            let deployLine;
            if (kind === 'smile') {
              deployLine = smileLine;
            } else if (kind === 'tx') {
              deployLine = `The merge changes nothing live: ${txLine}`;
            } else if (kind === 'both') {
              deployLine = `${smileLine}\n- The terminology server part changes nothing live: ${txLine}`;
            } else {
              deployLine = 'A change to `module-config/` or `deploy/` still deploys on merge (Argo CD syncs `main` automatically); a change under `terminology-servers/` changes nothing live';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `**Post-Merge Automation Failed**

            The automation encountered an error while processing the merged PR, so the post-merge notice may be missing.

            **Error details**: Check the [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) for details.

            **Next steps**:
            - ${deployLine}
            - A maintainer will review the run and follow up on this issue
            - Once that follow-up is posted here, a repo admin removes \`needs-manual-intervention\`; the issue then carries on as usual (\`deployed\` after the change is live)

            This issue has been labeled \`needs-manual-intervention\`.`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['needs-manual-intervention']
            });
