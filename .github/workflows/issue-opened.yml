name: Issue Opened / Edited

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to validate'
        required: true
        type: number
      job_type:
        description: 'Which validation to run'
        required: true
        type: choice
        options:
          - validate-ig
          - validate-tx

permissions:
  contents: read
  issues: write

jobs:
  # ============================================================================
  # JOB: Look up the issue author's permission on this repository
  # ============================================================================
  # Decides whether the IG and TX previews run automatically. The author's
  # repository role is used rather than author_association, which depends on
  # whether the author's org membership is public, and most of it is not here.
  # Triage and above are the people who triage issues here. A failed lookup
  # counts as no access, so the preview then waits for a maintainer dispatch.
  author-permission:
    name: Author permission
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'issues'
    permissions:
      contents: read
    outputs:
      auto_validate: ${{ steps.check.outputs.auto_validate }}
    steps:
      - name: Check author permission
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            let role = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.issue.user.login
              });
              role = data.role_name || data.permission || 'none';
            } catch (e) {
              core.info(`Permission lookup failed (${e.status}); treating as no access`);
            }
            const auto = ['admin', 'maintain', 'write', 'triage'].includes(role);
            core.info(`Author role: ${role}; automatic preview: ${auto}`);
            core.setOutput('auto_validate', auto ? 'true' : 'false');

  # ============================================================================
  # JOB: Auto-label priority and post welcome message for new issues
  # ============================================================================
  welcome:
    name: Welcome & Auto-label
    # Runs for every opened issue, including from the public. It uses only the
    # default GITHUB_TOKEN (no secrets) and executes no untrusted code, just GitHub
    # API calls via github-script, so the self-hosted runner is acceptable here.
    # Falls back to a GitHub-hosted runner (free on public repos) when CI_RUNNER
    # is unset.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Auto-label priority and post welcome
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // --- Priority auto-labeling ---
            if (body.includes('Critical - Blocking work')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, labels: ['priority:critical']
              });
            } else if (body.includes('High - Needed within 1 week')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, labels: ['priority:high']
              });
            } else if (body.includes('Medium - Needed within 2 weeks')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, labels: ['priority:medium']
              });
            }

            // --- Welcome message based on issue type ---
            const issueType = issue.labels
              .map(l => l.name)
              .find(name => ['ig-release', 'configuration', 'operations', 'tx-content'].includes(name));

            // Validation for IG release and TX content requests runs
            // automatically only for authors with triage access or above (see
            // the author-permission job). For other issues a maintainer
            // dispatches it after triage.
            let authorRole = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: issue.user.login
              });
              authorRole = data.role_name || data.permission || 'none';
            } catch (e) {}
            const autoValidated = ['admin', 'maintain', 'write', 'triage'].includes(authorRole);

            let message = '👋 Thank you for your request!\n\n';

            if (issueType === 'ig-release') {
              message += '## Next Steps for IG Release\n\n';
              message += '1. ✅ **Request received** - Your request is now in the queue\n';
              message += autoValidated
                ? '2. 🔍 **Validation** - Automated validation will run within 1 minute\n'
                : '2. 🔍 **Validation** - A maintainer will run the automated validation after triaging this request\n';
              message += '3. 📋 **Admin review** - Team will review and approve if validation passes\n';
              message += '4. 🤖 **PR auto-creation** - A pull request will be automatically generated\n';
              message += '5. 🚀 **Deployment** - After PR merge, deployment will occur (immediate or scheduled)\n';
              message += '6. ✅ **Verification** - You\'ll be asked to verify the deployment\n';
              message += '7. 🎉 **Complete** - You can close the issue after verification\n\n';
              message += '**Watch this issue for status updates** - Labels will change as work progresses.\n\n';
              message += 'Questions? Comment below and the team will respond.';
            } else if (issueType === 'configuration') {
              message += '## Next Steps for Configuration Change\n\n';
              message += '1. ✅ **Request received**\n';
              message += '2. 🔍 **Impact assessment** - Team will evaluate the change and potential impacts\n';
              message += '3. 📋 **ADR approval** (if needed) - Major changes require Architecture Decision Record\n';
              message += '4. 🚀 **Implementation** - Changes will be made and tested\n';
              message += '5. ✅ **Verification** - You\'ll be asked to verify the change meets requirements\n';
              message += '6. 📣 **Notification** - Stakeholders notified on Zulip\n\n';
              message += '**Labels indicate status** - Watch for label changes as work progresses.';
            } else if (issueType === 'operations') {
              message += '## Next Steps for Operational Request\n\n';
              message += '1. ✅ **Request received**\n';
              message += '2. 🔍 **Safety review** - Team will verify scope and safety checks\n';
              message += '3. 📅 **Scheduling** - Operation will be scheduled based on urgency and constraints\n';
              message += '4. ⚠️  **Pre-execution notice** - You\'ll be notified before the operation runs\n';
              message += '5. ▶️  **Execution** - Operation will be performed with monitoring\n';
              message += '6. ✅ **Verification** - Results verified against your verification plan\n';
              message += '7. 📣 **Completion notice** - Notification sent on Zulip\n\n';
              message += '**For destructive operations** (expunge/delete), additional approval may be required.';
            } else if (issueType === 'tx-content') {
              message += '## Next Steps for Terminology Server Content Change\n\n';
              message += '1. **Request received** - Your request is now in the queue\n';
              message += autoValidated
                ? '2. **Validation** - Automated validation and dry-run preview will run within 1 minute\n'
                : '2. **Validation** - A maintainer will run the automated validation and dry-run preview after triaging this request\n';
              message += '3. **Admin review** - Team will review and approve if validation passes\n';
              message += '4. **PR auto-creation** - A pull request will be automatically generated\n';
              message += '5. **Merge & manual entry** - After PR merge, a maintainer adds the matching entry to the Atomio feed by hand (no feeder syncs tx.dev any more; see [runbook step 1.1](https://github.com/aehrc/sparked-fhir-server-configuration/blob/main/docs/runbooks/ig-release.md#step-1-1))\n';
              message += '6. **Verification** - You\'ll be asked to verify the content change took effect\n\n';
              message += '**Watch this issue for status updates** - Labels will change as work progresses.\n\n';
              message += 'Questions? Comment below and the team will respond.';
            } else {
              message += 'A team member will review your request shortly and provide next steps.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: message
            });

  # ============================================================================
  # JOB: Validate IG release requests
  # ============================================================================
  validate-ig:
    name: Validate IG Request
    runs-on: arc-runner-set
    container:
      image: python:3.12-slim
    # This job runs a live dry-run against the server with the
    # CSIRO_FHIR_AUTH_64 credential. On issue events it runs automatically only
    # for issues whose author has triage access or above (author-permission
    # job). The IG release
    # issue form applies the 'ig-release' label for every author, so the label
    # alone does not decide this. For other issues a maintainer runs the preview
    # after triage by dispatching this workflow with the issue number and
    # job_type=validate-ig.
    needs: [author-permission]
    # !cancelled(): author-permission is skipped on workflow_dispatch, and a
    # skipped need would otherwise skip this job too.
    if: |
      !cancelled() && (
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'ig-release') &&
       needs.author-permission.outputs.auto_validate == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.job_type == 'validate-ig'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Parse issue details
        id: parse
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const checks = require(`${process.env.GITHUB_WORKSPACE}/scripts/issue_field_checks.js`);
            const issueNumber = context.payload.issue?.number || parseInt(process.env.ISSUE_NUMBER, 10) || null;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const body = issue.body || '';

            const extractField = (label) => {
              const regex = new RegExp(`### ${label}\\s*([\\s\\S]*?)(?=###|$)`, 'i');
              const match = body.match(regex);
              const value = match ? match[1].trim() : '';
              return value === '_No response_' ? '' : value;
            };

            const igName = extractField('Implementation Guide Name');
            const igVersion = extractField('IG Version');
            const packageId = extractField('NPM Package ID') || '';
            const packageUrl = extractField('Custom Package URL') || '';

            // Extract target nodes from checkboxes
            const targetNodesSection = extractField('Target SmileCDR Nodes');
            const selectedNodes = [];

            if (targetNodesSection.includes('[x]') || targetNodesSection.includes('[X]')) {
              const lines = targetNodesSection.split('\n');
              for (const line of lines) {
                if (line.includes('[x]') || line.includes('[X]')) {
                  // aucore is the only node since the ereq/hl7au decommission
                  // (2026-08-02). Issues opened before then may still tick ereq;
                  // it is ignored rather than dispatched at a node that is gone.
                  if (line.includes('aucore')) selectedNodes.push('aucore');
                }
              }
            }

            // Extract package options. Filter to checkbox lines so option 0 is
            // always installMode and option 1 fetchDependencies, regardless of
            // any blank lines (mirrors the create-ig-pr job).
            const packageOptions = extractField('Package Installation Options');
            const optionLines = packageOptions.split('\n').filter(l => l.includes('- ['));

            const installModeChecked = optionLines.length > 0 && (optionLines[0].includes('[X]') || optionLines[0].includes('[x]'));
            const installMode = installModeChecked ? 'STORE_AND_INSTALL' : 'STORE_ONLY';

            const fetchDepsChecked = optionLines.length > 1 && (optionLines[1].includes('[X]') || optionLines[1].includes('[x]'));

            const safeName = igName.toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '');

            const packageFileName = `package-${safeName}-${igVersion}.json`;

            let finalPackageId = packageId;
            if (!finalPackageId) {
              finalPackageId = `hl7.fhir.${safeName}`;
            }

            core.setOutput('issue_number', issueNumber);
            core.setOutput('ig_name', igName);
            core.setOutput('ig_version', igVersion);
            core.setOutput('package_id', finalPackageId);
            core.setOutput('package_id_provided', packageId ? 'true' : 'false');
            core.setOutput('package_url', packageUrl);
            core.setOutput('install_mode', installMode);
            core.setOutput('fetch_dependencies', fetchDepsChecked);
            core.setOutput('package_file_name', packageFileName);
            core.setOutput('selected_nodes', selectedNodes.join(','));
            core.setOutput('selected_nodes_count', selectedNodes.length);

            const formatErrors = checks.checkIgRequest({ igName, igVersion, packageId, packageUrl });
            core.setOutput('format_errors', formatErrors.map(e => `- ${e}`).join('\n'));

      - name: Validate required fields
        id: validate
        shell: bash
        env:
          IG_NAME: ${{ steps.parse.outputs.ig_name }}
          IG_VERSION: ${{ steps.parse.outputs.ig_version }}
          NODES_COUNT: ${{ steps.parse.outputs.selected_nodes_count }}
          FORMAT_ERRORS: ${{ steps.parse.outputs.format_errors }}
        run: |
          ERRORS=()

          if [ -z "$IG_NAME" ]; then
            ERRORS+=("- IG Name is required")
          fi

          if [ -z "$IG_VERSION" ]; then
            ERRORS+=("- IG Version is required")
          fi

          if [ "$NODES_COUNT" = "0" ]; then
            ERRORS+=("- At least one target node must be selected")
          fi

          # Fields that are present but not in the expected format
          # (scripts/issue_field_checks.js).
          if [ -n "$FORMAT_ERRORS" ]; then
            ERRORS+=("$FORMAT_ERRORS")
          fi

          if [ "${#ERRORS[@]}" -gt 0 ]; then
            echo "validation_passed=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${ERRORS[@]}" > validation_errors.txt
          else
            echo "validation_passed=true" >> "$GITHUB_OUTPUT"
            echo "All required fields present" > validation_errors.txt
          fi

      - name: Run dry-run preview
        if: steps.validate.outputs.validation_passed == 'true'
        id: dryrun
        shell: bash
        env:
          SMILECDR_BASE_URL: https://smile.sparked-fhir.com
          SMILECDR_AUTH_BASIC: ${{ secrets.CSIRO_FHIR_AUTH_64 }}
          NODES: ${{ steps.parse.outputs.selected_nodes }}
          PACKAGE_NAME: ${{ steps.parse.outputs.package_id }}
          PACKAGE_VERSION: ${{ steps.parse.outputs.ig_version }}
          PACKAGE_URL: ${{ steps.parse.outputs.package_url }}
          INSTALL_MODE: ${{ steps.parse.outputs.install_mode }}
          FETCH_DEPENDENCIES: ${{ steps.parse.outputs.fetch_dependencies }}
        run: |
          echo "Running dry-run for package: $PACKAGE_NAME@$PACKAGE_VERSION"
          echo "Target nodes: $NODES"

          # Build the package JSON with json.dumps so each field is encoded as
          # a JSON string whatever characters it holds.
          CUSTOM_PACKAGE=$(python - <<'PY'
          import json, os
          pkg = {
              "name": os.environ["PACKAGE_NAME"],
              "version": os.environ["PACKAGE_VERSION"],
              "installMode": os.environ["INSTALL_MODE"],
              "fetchDependencies": os.environ["FETCH_DEPENDENCIES"] == "true",
          }
          if os.environ.get("PACKAGE_URL"):
              pkg["packageUrl"] = os.environ["PACKAGE_URL"]
          print(json.dumps([pkg]))
          PY
          )

          python scripts/sync_packages.py \
            --nodes "$NODES" \
            --source custom \
            --packages "$CUSTOM_PACKAGE" \
            --dry-run \
            2>&1 | tee dryrun_output.txt

          EXIT_CODE=${PIPESTATUS[0]}
          echo "dryrun_exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Generate preview comment
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          VALIDATION_PASSED: ${{ steps.validate.outputs.validation_passed }}
          DRYRUN_EXIT_CODE: ${{ steps.dryrun.outputs.dryrun_exit_code }}
          IG_NAME: ${{ steps.parse.outputs.ig_name }}
          IG_VERSION: ${{ steps.parse.outputs.ig_version }}
          PACKAGE_ID: ${{ steps.parse.outputs.package_id }}
          PACKAGE_ID_PROVIDED: ${{ steps.parse.outputs.package_id_provided }}
          INSTALL_MODE: ${{ steps.parse.outputs.install_mode }}
          FETCH_DEPENDENCIES: ${{ steps.parse.outputs.fetch_dependencies }}
          SELECTED_NODES: ${{ steps.parse.outputs.selected_nodes }}
          PACKAGE_URL: ${{ steps.parse.outputs.package_url }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env;
            const issueNumber = parseInt(env.ISSUE_NUMBER, 10);
            const validationPassed = env.VALIDATION_PASSED === 'true';
            const dryrunExitCode = env.DRYRUN_EXIT_CODE || '';
            // Edits re-run validation automatically only on the issue-event
            // path; a dispatched run is repeated by a maintainer.
            const rerunNote = context.eventName === 'issues'
              ? 'Validation will run automatically after editing'
              : 'Ask a maintainer to re-run validation after editing';

            let comment = '## Automated Validation & Preview\n\n';

            if (!validationPassed) {
              comment += '### Validation Failed\n\n';
              comment += 'Please fix the following issues:\n\n';
              const errors = fs.readFileSync('validation_errors.txt', 'utf8');
              comment += errors;
              comment += '\n\n---\n';
              comment += `Update the issue with the required information. ${rerunNote}.\n`;
            } else {
              comment += '### Validation Passed\n\n';
              comment += '**IG Details:**\n';
              comment += `- **Name**: ${env.IG_NAME}\n`;
              comment += `- **Version**: ${env.IG_VERSION}\n`;
              comment += `- **Package ID**: ${env.PACKAGE_ID}`;

              if (env.PACKAGE_ID_PROVIDED === 'false') {
                comment += ' *(auto-generated - please verify)*';
              }
              comment += '\n';
              comment += `- **Install Mode**: ${env.INSTALL_MODE}\n`;
              comment += `- **Fetch Dependencies**: ${env.FETCH_DEPENDENCIES}\n`;
              comment += `- **Target Nodes**: ${env.SELECTED_NODES}\n`;

              const previewPackageUrl = env.PACKAGE_URL;
              if (previewPackageUrl) {
                comment += `- **Custom Package URL**: ${previewPackageUrl}\n`;
              }

              comment += '\n### Dry-Run Preview\n\n';

              if (dryrunExitCode === '0') {
                comment += '**Dry-run completed successfully!**\n\n';
              } else {
                comment += '**Dry-run encountered issues** (this may be expected if testing connectivity)\n\n';
              }

              comment += '<details>\n';
              comment += '<summary>Click to view detailed dry-run output</summary>\n\n';
              comment += '```\n';

              try {
                const dryrunOutput = fs.readFileSync('dryrun_output.txt', 'utf8');
                const maxLength = 50000;
                if (dryrunOutput.length > maxLength) {
                  comment += dryrunOutput.substring(0, maxLength);
                  comment += '\n\n... (output truncated due to length)\n';
                } else {
                  comment += dryrunOutput;
                }
              } catch (e) {
                comment += 'No dry-run output available\n';
              }

              comment += '```\n';
              comment += '</details>\n\n';

              comment += '---\n\n';
              comment += '### Next Steps\n\n';
              comment += 'If everything looks correct:\n\n';
              comment += '1. Review the dry-run output above\n';
              comment += '2. Verify the package ID is correct\n';
              comment += '3. Add the `ready-for-automation` label to trigger PR creation\n\n';
              comment += 'If changes are needed:\n\n';
              comment += '- Edit the issue to update fields\n';
              comment += `- ${rerunNote}\n`;
            }

            comment += '\n\n---\n';
            comment += `*Last validated: ${new Date().toISOString()}*`;

            // Find and delete previous validation comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            for (const prevComment of comments) {
              if (prevComment.user.type === 'Bot' &&
                  prevComment.body.includes('Automated Validation & Preview')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: prevComment.id
                });
              }
            }

            // Post new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

            // Update labels based on validation
            if (validationPassed) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'needs-review'
                });
              } catch (e) {
                // Label might not exist
              }
            }

  # ============================================================================
  # JOB: Validate TX content requests
  # ============================================================================
  validate-tx:
    name: Validate TX Content Request
    runs-on: arc-runner-set
    container:
      image: python:3.12-slim
    # Same rule as validate-ig: on issue events this runs automatically only for
    # issues whose author has triage access or above, because the TX
    # content issue form applies the 'tx-content' label for every author. For
    # other issues a maintainer dispatches this workflow with the issue number
    # and job_type=validate-tx after triage.
    needs: [author-permission]
    # !cancelled(): author-permission is skipped on workflow_dispatch, and a
    # skipped need would otherwise skip this job too.
    if: |
      !cancelled() && (
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'tx-content') &&
       needs.author-permission.outputs.auto_validate == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.job_type == 'validate-tx'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Parse issue details
        id: parse
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const checks = require(`${process.env.GITHUB_WORKSPACE}/scripts/issue_field_checks.js`);
            const issueNumber = context.payload.issue?.number || parseInt(process.env.ISSUE_NUMBER, 10) || null;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const body = issue.body || '';

            const extractField = (label) => {
              const regex = new RegExp(`### ${label}\\s*([\\s\\S]*?)(?=###|$)`, 'i');
              const match = body.match(regex);
              const value = match ? match[1].trim() : '';
              return value === '_No response_' ? '' : value;
            };

            const actionType = extractField('Action Type');
            const packageId = extractField('Package ID');
            const packageListUrl = extractField('Package List URL');
            const displayName = extractField('Display Name');
            const versionMode = extractField('Version Mode');
            const pinnedVersions = extractField('Pinned Versions');
            const feedName = extractField('Feed Name');
            const businessJustification = extractField('Business Justification');

            // Extract target servers from checkboxes
            const targetSection = extractField('Target Terminology Server');
            const selectedServers = [];
            if (targetSection.includes('[x]') || targetSection.includes('[X]')) {
              const lines = targetSection.split('\n');
              for (const line of lines) {
                if (line.includes('[x]') || line.includes('[X]')) {
                  if (line.includes('tx.dev')) selectedServers.push('tx-dev');
                  if (line.includes('tx.hl7')) selectedServers.push('tx-hl7');
                }
              }
            }

            // Extract statuses from checkboxes
            const statusSection = extractField('Release Statuses to Include');
            const selectedStatuses = [];
            if (statusSection) {
              const lines = statusSection.split('\n');
              for (const line of lines) {
                if (line.includes('[x]') || line.includes('[X]')) {
                  if (line.includes('trial-use')) selectedStatuses.push('trial-use');
                  else if (line.includes('ballot')) selectedStatuses.push('ballot');
                  else if (line.includes('preview')) selectedStatuses.push('preview');
                  else if (line.includes('draft')) selectedStatuses.push('draft');
                }
              }
            }

            // Determine CLI action name
            let cliAction = '';
            if (actionType.includes('Add')) cliAction = 'add-watch';
            else if (actionType.includes('Remove')) cliAction = 'remove-watch';
            else if (actionType.includes('Modify')) cliAction = 'modify-watch';

            const safeName = packageId.toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '');

            core.setOutput('issue_number', issueNumber);
            core.setOutput('action_type', actionType);
            core.setOutput('cli_action', cliAction);
            core.setOutput('package_id', packageId);
            core.setOutput('package_list_url', packageListUrl);
            core.setOutput('display_name', displayName);
            core.setOutput('version_mode', versionMode);
            core.setOutput('pinned_versions', pinnedVersions);
            core.setOutput('feed_name', feedName);
            core.setOutput('selected_servers', selectedServers.join(','));
            core.setOutput('selected_servers_count', selectedServers.length);
            core.setOutput('selected_statuses', selectedStatuses.join(','));
            core.setOutput('selected_statuses_count', selectedStatuses.length);
            core.setOutput('safe_name', safeName);
            core.setOutput('business_justification', businessJustification);

            const formatErrors = checks.checkTxRequest({
              actionType, packageId, packageListUrl, displayName, versionMode, pinnedVersions, feedName
            });
            core.setOutput('format_errors', formatErrors.map(e => `- ${e}`).join('\n'));

      - name: Validate required fields
        id: validate
        shell: bash
        env:
          CLI_ACTION: ${{ steps.parse.outputs.cli_action }}
          PACKAGE_ID: ${{ steps.parse.outputs.package_id }}
          PACKAGE_LIST_URL: ${{ steps.parse.outputs.package_list_url }}
          SERVERS_COUNT: ${{ steps.parse.outputs.selected_servers_count }}
          STATUSES_COUNT: ${{ steps.parse.outputs.selected_statuses_count }}
          VERSION_MODE: ${{ steps.parse.outputs.version_mode }}
          PINNED_VERSIONS: ${{ steps.parse.outputs.pinned_versions }}
          BUSINESS_JUSTIFICATION: ${{ steps.parse.outputs.business_justification }}
          FORMAT_ERRORS: ${{ steps.parse.outputs.format_errors }}
        run: |
          ERRORS=()

          if [ -z "$CLI_ACTION" ]; then
            ERRORS+=("- Action Type is required")
          fi

          if [ -z "$PACKAGE_ID" ]; then
            ERRORS+=("- Package ID is required")
          fi

          if [ "$SERVERS_COUNT" = "0" ]; then
            ERRORS+=("- At least one target server must be selected")
          fi

          if [ "$CLI_ACTION" = "add-watch" ] && [ -z "$PACKAGE_LIST_URL" ]; then
            ERRORS+=("- Package List URL is required when adding a new watch")
          fi

          if [ "$CLI_ACTION" = "add-watch" ] && [ "$STATUSES_COUNT" = "0" ]; then
            ERRORS+=("- At least one release status must be selected when adding a watch")
          fi

          if [ "$VERSION_MODE" = "pinned" ] && [ -z "$PINNED_VERSIONS" ]; then
            ERRORS+=("- Pinned Versions is required when Version Mode is 'pinned'")
          fi

          if [ -z "$BUSINESS_JUSTIFICATION" ]; then
            ERRORS+=("- Business Justification is required")
          fi

          # Fields that are present but not in the expected format
          # (scripts/issue_field_checks.js).
          if [ -n "$FORMAT_ERRORS" ]; then
            ERRORS+=("$FORMAT_ERRORS")
          fi

          if [ "${#ERRORS[@]}" -gt 0 ]; then
            echo "validation_passed=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${ERRORS[@]}" > validation_errors.txt
          else
            echo "validation_passed=true" >> "$GITHUB_OUTPUT"
            echo "All required fields present" > validation_errors.txt
          fi

      - name: Run dry-run preview
        if: steps.validate.outputs.validation_passed == 'true'
        id: dryrun
        shell: bash
        env:
          SERVERS: ${{ steps.parse.outputs.selected_servers }}
          ACTION: ${{ steps.parse.outputs.cli_action }}
          PACKAGE_ID: ${{ steps.parse.outputs.package_id }}
          PACKAGE_LIST_URL: ${{ steps.parse.outputs.package_list_url }}
          DISPLAY_NAME: ${{ steps.parse.outputs.display_name }}
          STATUSES: ${{ steps.parse.outputs.selected_statuses }}
          VERSION_MODE: ${{ steps.parse.outputs.version_mode }}
          PINNED_VERSIONS: ${{ steps.parse.outputs.pinned_versions }}
          FEED_NAME: ${{ steps.parse.outputs.feed_name }}
        run: |
          # An array keeps each value a single argument (a display name with
          # spaces stays one --display-name value).
          cmd=(python scripts/update_tx_helm_values.py --action "$ACTION" --server "$SERVERS" --package-id "$PACKAGE_ID" --dry-run)

          if [ -n "$PACKAGE_LIST_URL" ]; then
            cmd+=(--package-list-url "$PACKAGE_LIST_URL")
          fi

          if [ -n "$DISPLAY_NAME" ]; then
            cmd+=(--display-name "$DISPLAY_NAME")
          fi

          if [ -n "$STATUSES" ]; then
            cmd+=(--statuses "$STATUSES")
          fi

          if [ -n "$VERSION_MODE" ]; then
            cmd+=(--version-mode "$VERSION_MODE")
          fi

          if [ -n "$PINNED_VERSIONS" ]; then
            cmd+=(--versions "${PINNED_VERSIONS// /}")
          fi

          if [ -n "$FEED_NAME" ]; then
            cmd+=(--feed-name "$FEED_NAME")
          fi

          echo "Running: ${cmd[*]}"
          "${cmd[@]}" 2>&1 | tee dryrun_output.txt

          EXIT_CODE=${PIPESTATUS[0]}
          echo "dryrun_exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Generate preview comment
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          VALIDATION_PASSED: ${{ steps.validate.outputs.validation_passed }}
          DRYRUN_EXIT_CODE: ${{ steps.dryrun.outputs.dryrun_exit_code }}
          ACTION_TYPE: ${{ steps.parse.outputs.action_type }}
          PACKAGE_ID: ${{ steps.parse.outputs.package_id }}
          SELECTED_SERVERS: ${{ steps.parse.outputs.selected_servers }}
          PACKAGE_LIST_URL: ${{ steps.parse.outputs.package_list_url }}
          DISPLAY_NAME: ${{ steps.parse.outputs.display_name }}
          SELECTED_STATUSES: ${{ steps.parse.outputs.selected_statuses }}
          VERSION_MODE: ${{ steps.parse.outputs.version_mode }}
          PINNED_VERSIONS: ${{ steps.parse.outputs.pinned_versions }}
          FEED_NAME: ${{ steps.parse.outputs.feed_name }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env;
            const issueNumber = parseInt(env.ISSUE_NUMBER, 10);
            const validationPassed = env.VALIDATION_PASSED === 'true';
            const dryrunExitCode = env.DRYRUN_EXIT_CODE || '';
            // Edits re-run validation automatically only on the issue-event
            // path; a dispatched run is repeated by a maintainer.
            const rerunNote = context.eventName === 'issues'
              ? 'Validation will run automatically after editing'
              : 'Ask a maintainer to re-run validation after editing';

            let comment = '## Automated Validation & Preview\n\n';

            if (!validationPassed) {
              comment += '### Validation Failed\n\n';
              comment += 'Please fix the following issues:\n\n';
              const errors = fs.readFileSync('validation_errors.txt', 'utf8');
              comment += errors;
              comment += '\n\n---\n';
              comment += `Edit the issue to fix these fields. ${rerunNote}.\n`;
            } else {
              comment += '### Validation Passed\n\n';
              comment += '**Request Details:**\n';
              comment += `- **Action**: ${env.ACTION_TYPE}\n`;
              comment += `- **Package ID**: ${env.PACKAGE_ID}\n`;
              comment += `- **Target Servers**: ${env.SELECTED_SERVERS}\n`;

              const packageListUrl = env.PACKAGE_LIST_URL;
              if (packageListUrl) {
                comment += `- **Package List URL**: ${packageListUrl}\n`;
              }

              const displayName = env.DISPLAY_NAME;
              if (displayName) {
                comment += `- **Display Name**: ${displayName}\n`;
              }

              const statuses = env.SELECTED_STATUSES;
              if (statuses) {
                comment += `- **Statuses**: ${statuses}\n`;
              }

              comment += `- **Version Mode**: ${env.VERSION_MODE}\n`;

              const pinnedVersions = env.PINNED_VERSIONS;
              if (pinnedVersions) {
                comment += `- **Pinned Versions**: ${pinnedVersions}\n`;
              }

              const feedName = env.FEED_NAME;
              if (feedName) {
                comment += `- **Feed Name**: ${feedName}\n`;
              }

              comment += '\n### Dry-Run Preview\n\n';

              if (dryrunExitCode === '0') {
                comment += '**Dry-run completed successfully!**\n\n';
              } else {
                comment += '**Dry-run encountered issues** - review the output below.\n\n';
              }

              comment += '<details>\n';
              comment += '<summary>Click to view dry-run output</summary>\n\n';
              comment += '```\n';

              try {
                const dryrunOutput = fs.readFileSync('dryrun_output.txt', 'utf8');
                const maxLength = 50000;
                if (dryrunOutput.length > maxLength) {
                  comment += dryrunOutput.substring(0, maxLength);
                  comment += '\n\n... (output truncated)\n';
                } else {
                  comment += dryrunOutput;
                }
              } catch (e) {
                comment += 'No dry-run output available\n';
              }

              comment += '```\n';
              comment += '</details>\n\n';

              comment += '---\n\n';
              comment += '### Next Steps\n\n';
              comment += 'If everything looks correct:\n\n';
              comment += '1. Review the dry-run output above\n';
              comment += '2. Add the `ready-for-automation` label to trigger PR creation\n\n';
              comment += 'If changes are needed:\n\n';
              comment += '- Edit the issue to update fields\n';
              comment += `- ${rerunNote}\n`;
            }

            comment += '\n\n---\n';
            comment += `*Last validated: ${new Date().toISOString()}*`;

            // Find and delete previous validation comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            for (const prevComment of comments) {
              if (prevComment.user.type === 'Bot' &&
                  prevComment.body.includes('Automated Validation & Preview')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: prevComment.id
                });
              }
            }

            // Post new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

            // Update labels based on validation
            if (validationPassed) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'needs-review'
                });
              } catch (e) {
                // Label might not exist
              }
            }
