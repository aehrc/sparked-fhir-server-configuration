name: Load Test Data

on:
  workflow_dispatch:
    inputs:
      upload_method:
        description: "Upload method: 'direct' (PUT to FHIR server) or 'fhirflare' (via FHIRFlare proxy)"
        required: true
        type: choice
        default: "direct"
        options:
          - direct
          - fhirflare
      target_node:
        description: "Target FHIR server node"
        required: true
        type: choice
        default: "aucore"
        options:
          - aucore
          - custom
      custom_fhir_url:
        description: "Custom FHIR server URL (only when target_node=custom). Must be https:// on sparked-fhir.com or a subdomain of it, e.g. https://smile.sparked-fhir.com/aucore/fhir/DEFAULT"
        required: false
        type: string
      data_source:
        description: "Test data Git repository URL: https://github.com/hl7au/<repo> or https://github.com/aehrc/<repo>"
        required: false
        default: "https://github.com/hl7au/au-fhir-test-data"
        type: string
      data_folder:
        description: "Folder within repo containing test data (relative path)"
        required: false
        default: "au-fhir-test-data-set"
        type: string
      upload_mode:
        description: "Upload mode (fhirflare method only)"
        required: false
        type: choice
        default: "individual"
        options:
          - individual
          - bundle
          - transaction
      batch_size:
        description: "Number of files per batch"
        required: false
        default: "50"
        type: string
      exclude_patterns:
        description: "Comma-separated directory patterns to exclude"
        required: false
        default: "vendor-demonstrator"
        type: string
      dry_run:
        description: "Dry run (parse files but do not upload)"
        required: false
        default: false
        type: boolean
      continue_on_error:
        description: "Continue uploading after errors"
        required: false
        default: true
        type: boolean
      issue_number:
        description: "Issue number to post results to (optional)"
        required: false
        type: number

  workflow_call:
    inputs:
      upload_method:
        required: true
        type: string
        default: "direct"
      target_node:
        required: true
        type: string
        default: "aucore"
      custom_fhir_url:
        required: false
        type: string
      data_source:
        required: false
        type: string
        default: "https://github.com/hl7au/au-fhir-test-data"
      data_folder:
        required: false
        type: string
        default: "au-fhir-test-data-set"
      upload_mode:
        required: false
        type: string
        default: "individual"
      batch_size:
        required: false
        type: string
        default: "50"
      exclude_patterns:
        required: false
        type: string
        default: "vendor-demonstrator"
      dry_run:
        required: false
        type: boolean
        default: false
      continue_on_error:
        required: false
        type: boolean
        default: true
      issue_number:
        required: false
        type: number
    secrets:
      CSIRO_FHIR_AUTH_64:
        required: false
      FHIRFLARE_API_KEY:
        required: false
      FHIRFLARE_URL:
        required: false
      FHIR_USERNAME:
        required: false
      FHIR_PASSWORD:
        required: false

permissions:
  contents: read
  issues: write
  id-token: write # OIDC for the ECR pull role, which can only pull the loader image

jobs:
  load-data:
    name: Load FHIR Test Data
    runs-on: arc-runner-set
    # The loader image lives in a private ECR repo. A job-level `container:` is
    # pulled before any step can authenticate, which fails on arc-runner-set
    # ("no basic auth credentials"). Authenticate with OIDC first and run the
    # loader with `docker run` instead. The role in vars.ECR_PULL_ROLE_ARN can
    # only pull the sparked-test-data-loader image.
    env:
      LOADER_IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com/sparked-test-data-loader:latest

    steps:
      # Every value reaches the shell through env rather than inline
      # expressions, so quotes, dollar signs and newlines in an input no longer
      # break the step. Each input is also checked against the format it must
      # have before any other step uses it, so a mistyped value stops the run
      # here with a message that names the input.
      - name: Resolve inputs
        id: inputs
        env:
          UPLOAD_METHOD: ${{ inputs.upload_method || 'direct' }}
          TARGET_NODE: ${{ inputs.target_node || 'aucore' }}
          CUSTOM_FHIR_URL: ${{ inputs.custom_fhir_url }}
          DATA_SOURCE: ${{ inputs.data_source || 'https://github.com/hl7au/au-fhir-test-data' }}
          DATA_FOLDER: ${{ inputs.data_folder || 'au-fhir-test-data-set' }}
          UPLOAD_MODE: ${{ inputs.upload_mode || 'individual' }}
          BATCH_SIZE: ${{ inputs.batch_size || '50' }}
          EXCLUDE: ${{ inputs.exclude_patterns || 'vendor-demonstrator' }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          export LC_ALL=C
          ERRORS=0
          fail() { echo "::error::$1"; ERRORS=1; }

          # Resolve FHIR URL from node name
          case "$TARGET_NODE" in
            aucore) FHIR_URL="https://smile.sparked-fhir.com/aucore/fhir/DEFAULT" ;;
            custom) FHIR_URL="$CUSTOM_FHIR_URL" ;;
            *)      fail "target_node must be aucore or custom"; FHIR_URL="" ;;
          esac

          # Custom targets are limited to the Sparked FHIR servers: https on
          # sparked-fhir.com or one of its subdomains.
          FHIR_URL_RE='^https://([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)*sparked-fhir\.com(/[A-Za-z0-9._~/-]*)?$'
          if [ "$TARGET_NODE" = "custom" ]; then
            if [ -z "$FHIR_URL" ]; then
              fail "FHIR URL is empty. If target_node=custom, provide custom_fhir_url."
            elif ! [[ "$FHIR_URL" =~ $FHIR_URL_RE ]]; then
              fail "custom_fhir_url must be an https:// URL on sparked-fhir.com or a subdomain of it, with no user name, port or query, e.g. https://smile.sparked-fhir.com/aucore/fhir/DEFAULT"
            fi
          fi

          DATA_SOURCE_RE='^https://github\.com/(hl7au|aehrc)/[A-Za-z0-9._-]+(\.git)?$'
          if ! [[ "$DATA_SOURCE" =~ $DATA_SOURCE_RE ]] || [[ "$DATA_SOURCE" =~ /\.\.?(\.git)?$ ]]; then
            fail "data_source must be https://github.com/hl7au/<repo> or https://github.com/aehrc/<repo>"
          fi

          DATA_FOLDER_RE='^[A-Za-z0-9._/-]+$'
          if ! [[ "$DATA_FOLDER" =~ $DATA_FOLDER_RE ]] || [[ "$DATA_FOLDER" == /* ]] || [[ "/$DATA_FOLDER/" == */../* ]]; then
            fail "data_folder must be a relative path inside the repository (letters, digits, '.', '_', '-', '/') with no '..' segment"
          fi

          case "$UPLOAD_METHOD" in direct|fhirflare) ;; *) fail "upload_method must be direct or fhirflare" ;; esac
          case "$UPLOAD_MODE" in individual|bundle|transaction) ;; *) fail "upload_mode must be individual, bundle or transaction" ;; esac
          case "$DRY_RUN" in true|false) ;; *) fail "dry_run must be true or false" ;; esac
          case "$CONTINUE_ON_ERROR" in true|false) ;; *) fail "continue_on_error must be true or false" ;; esac
          [[ "$BATCH_SIZE" =~ ^[0-9]{1,4}$ ]] || fail "batch_size must be a whole number of at most 4 digits"
          [[ "$EXCLUDE" =~ ^[A-Za-z0-9._,-]*$ ]] || fail "exclude_patterns must be a comma-separated list of names (letters, digits, '.', '_', '-')"
          [[ "$ISSUE_NUMBER" =~ ^[0-9]*$ ]] || fail "issue_number must be a number"

          if [ "$ERRORS" -ne 0 ]; then
            exit 1
          fi

          {
            echo "upload_method=$UPLOAD_METHOD"
            echo "fhir_url=$FHIR_URL"
            echo "target_node=$TARGET_NODE"
            echo "data_source=$DATA_SOURCE"
            echo "data_folder=$DATA_FOLDER"
            echo "upload_mode=$UPLOAD_MODE"
            echo "batch_size=$BATCH_SIZE"
            echo "exclude_patterns=$EXCLUDE"
            echo "dry_run=$DRY_RUN"
            echo "continue_on_error=$CONTINUE_ON_ERROR"
            echo "issue_number=$ISSUE_NUMBER"
          } >> "$GITHUB_OUTPUT"

          # `manage-test-data.yml` cannot pass an empty number through
          # `workflow_call`, so it sends 0 to mean "no issue". Treat 0 and empty
          # alike: a comment on issue 0 is a 404 that fails the job before any
          # work happens, which is how a dry run of `clear-and-load-aucore`
          # failed with nothing attempted.
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "0" ]; then
            echo "has_issue=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_issue=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PULL_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull loader image
        run: docker pull -q "$LOADER_IMAGE"

      - name: Comment on issue - Starting
        if: steps.inputs.outputs.has_issue == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.inputs.outputs.issue_number }}
          UPLOAD_METHOD: ${{ steps.inputs.outputs.upload_method }}
          FHIR_URL: ${{ steps.inputs.outputs.fhir_url }}
          DATA_SOURCE: ${{ steps.inputs.outputs.data_source }}
          UPLOAD_MODE: ${{ steps.inputs.outputs.upload_mode }}
          DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## Test Data Load Starting

            **Details:**
            - Upload Method: \`${process.env.UPLOAD_METHOD}\`
            - Target: \`${process.env.FHIR_URL}\`
            - Data Source: \`${process.env.DATA_SOURCE}\`
            - Upload Mode: \`${process.env.UPLOAD_MODE}\`
            - Dry Run: \`${process.env.DRY_RUN}\`
            - Workflow Run: [View Progress](${runUrl})

            This may take several minutes depending on the data volume.`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['in-progress']
            });

      - name: Clone test data repository
        id: clone
        env:
          DATA_SOURCE: ${{ steps.inputs.outputs.data_source }}
          DATA_FOLDER: ${{ steps.inputs.outputs.data_folder }}
        run: |
          # RUNNER_TEMP lives on the runner's work volume, which the dind
          # daemon shares, so it can be bind-mounted into the loader container.
          WORK_DIR="$RUNNER_TEMP/fhir-data"
          rm -rf "$WORK_DIR" && mkdir -p "$WORK_DIR"
          git clone -- "$DATA_SOURCE" "$WORK_DIR"

          DATA_DIR="$WORK_DIR/$DATA_FOLDER"
          if [ ! -d "$DATA_DIR" ]; then
            echo "::error::Data folder not found: $DATA_DIR"
            echo "Available contents:"
            ls -la "$WORK_DIR"
            exit 1
          fi

          TOTAL_FILES=$(find "$DATA_DIR" -name "*.json" -type f | wc -l)
          echo "Found $TOTAL_FILES JSON files in $DATA_DIR"
          echo "data_dir=$DATA_DIR" >> "$GITHUB_OUTPUT"
          echo "total_files=$TOTAL_FILES" >> "$GITHUB_OUTPUT"

      - name: Upload test data
        id: upload
        env:
          FHIR_AUTH_HEADER: ${{ secrets.CSIRO_FHIR_AUTH_64 }}
          FHIRFLARE_URL: ${{ secrets.FHIRFLARE_URL }}
          FHIRFLARE_API_KEY: ${{ secrets.FHIRFLARE_API_KEY }}
          FHIR_USERNAME: ${{ secrets.FHIR_USERNAME }}
          FHIR_PASSWORD: ${{ secrets.FHIR_PASSWORD }}
          UPLOAD_METHOD: ${{ steps.inputs.outputs.upload_method }}
          FHIR_URL: ${{ steps.inputs.outputs.fhir_url }}
          DATA_FOLDER: ${{ steps.inputs.outputs.data_folder }}
          UPLOAD_MODE: ${{ steps.inputs.outputs.upload_mode }}
          BATCH_SIZE: ${{ steps.inputs.outputs.batch_size }}
          EXCLUDE_PATTERNS: ${{ steps.inputs.outputs.exclude_patterns }}
          DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
          CONTINUE_ON_ERROR: ${{ steps.inputs.outputs.continue_on_error }}
        run: |
          # The loader image runs as a non-root user that cannot write into the
          # bind-mounted $RUNNER_TEMP itself, so both summary files were lost to
          # "permission denied" and the run summary and issue comment came back
          # with no numbers. Write them into a world-writable subdirectory
          # instead. The exit code, not the summary, decides success, so this was
          # silent.
          OUT_DIR="$RUNNER_TEMP/loader-out"
          rm -rf "$OUT_DIR" && mkdir -p "$OUT_DIR" && chmod 777 "$OUT_DIR"

          # Paths are as seen inside the loader container ($RUNNER_TEMP -> /work).
          # An array keeps each value a single argument.
          args=(
            --method "$UPLOAD_METHOD"
            --fhir-url "$FHIR_URL"
            --data-dir "/work/fhir-data/$DATA_FOLDER"
            --upload-mode "$UPLOAD_MODE"
            --batch-size "$BATCH_SIZE"
            --summary-file /work/loader-out/upload-summary.json
            --github-step-summary /work/loader-out/step-summary.md
          )

          if [ -n "$EXCLUDE_PATTERNS" ]; then
            args+=(--exclude-patterns "$EXCLUDE_PATTERNS")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ "$CONTINUE_ON_ERROR" != "true" ]; then
            args+=(--fail-on-error)
          fi

          set +e
          docker run --rm \
            -e FHIR_AUTH_HEADER -e FHIRFLARE_URL -e FHIRFLARE_API_KEY \
            -e FHIR_USERNAME -e FHIR_PASSWORD \
            -v "$RUNNER_TEMP:/work" "$LOADER_IMAGE" load "${args[@]}"
          EXIT_CODE=$?
          set -e

          # Surface the loader's markdown summary written inside the mount
          if [ -f "$OUT_DIR/step-summary.md" ]; then
            cat "$OUT_DIR/step-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ $EXIT_CODE -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

          # Read summary as single-line JSON for output
          if [ -f "$OUT_DIR/upload-summary.json" ]; then
            DELIMITER="SUMMARY_$(date +%s%N)"
            {
              echo "summary<<${DELIMITER}"
              tr -d '\n' < "$OUT_DIR/upload-summary.json"
              echo ""
              echo "${DELIMITER}"
            } >> "$GITHUB_OUTPUT"
          fi

          exit $EXIT_CODE

      - name: Post results to issue - Success
        if: always() && steps.inputs.outputs.has_issue == 'true' && steps.upload.outputs.status == 'success'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.inputs.outputs.issue_number }}
          DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
          SUMMARY: ${{ steps.upload.outputs.summary }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const dryRun = process.env.DRY_RUN === 'true' ? ' (dry run)' : '';

            let summaryText = '';
            try {
              const summary = JSON.parse(process.env.SUMMARY || '');
              summaryText = `- Total Files: ${summary.total}
            - Succeeded: ${summary.succeeded}
            - Failed: ${summary.failed}
            - Duration: ${summary.duration_seconds}s`;
            } catch (e) {
              summaryText = '- See workflow logs for details';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## Test Data Load Complete${dryRun}

            ${dryRun ? 'No resources were uploaded. This run only parsed the files a real load would send.' : 'The test data has been successfully loaded.'}

            **Results:**
            ${summaryText}

            - Workflow Run: [View Logs](${runUrl})

            ${dryRun ? 'Re-run without dry run to load the node.' : 'Please verify the data has been loaded as expected.'}`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['complete']
            });

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
            } catch (e) {}

      - name: Post results to issue - Failure
        if: always() && steps.inputs.outputs.has_issue == 'true' && steps.upload.outputs.status == 'failure'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.inputs.outputs.issue_number }}
          SUMMARY: ${{ steps.upload.outputs.summary }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            let errorDetails = '';
            try {
              const summary = JSON.parse(process.env.SUMMARY || '');
              errorDetails = `- Total Files: ${summary.total}
            - Succeeded: ${summary.succeeded}
            - Failed: ${summary.failed}
            - Duration: ${summary.duration_seconds}s`;
              if (summary.errors && summary.errors.length > 0) {
                errorDetails += '\n\n**First errors:**\n';
                for (const err of summary.errors.slice(0, 5)) {
                  errorDetails += `- \`${err.file}\`: ${err.status_code || 'N/A'} - ${err.error?.substring(0, 100) || 'Unknown'}\n`;
                }
              }
            } catch (e) {
              errorDetails = '- See workflow logs for details';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## Test Data Load Failed

            The test data loading operation encountered errors.

            **Results:**
            ${errorDetails}

            - Workflow Run: [View Logs](${runUrl})

            Please review the errors and try again, or contact the infrastructure team.`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['blocked']
            });

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
            } catch (e) {}
